name: Read A21102480004 for study
on:
  push:
    paths:
      - '.github/workflows/read-a21102480004.yml'
permissions:
  contents: read
jobs:
  read-paper:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            papers/CPMCM/2021/fulltext/A/A21102480004.pdf
            problems/CPMCM/2021/A/相关矩阵组的低复杂度计算和存储建模.docx
            problems/CPMCM/2021/A/Readme.txt
            .github/workflows/read-a21102480004.yml
      - name: Install readers
        run: python -m pip install --quiet pypdf pymupdf python-docx
      - name: Extract paper and problem text and render every paper page
        shell: bash
        run: |
          mkdir -p /tmp/a21102480004/pages
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          from docx import Document
          import pymupdf

          p = Path('papers/CPMCM/2021/fulltext/A/A21102480004.pdf')
          d = Path('problems/CPMCM/2021/A/相关矩阵组的低复杂度计算和存储建模.docx')
          out = Path('/tmp/a21102480004')

          r = PdfReader(str(p))
          print(f'PDF_META pages={len(r.pages)} encrypted={r.is_encrypted} bytes={p.stat().st_size}')
          pytext=[]
          for i,page in enumerate(r.pages,1):
              pytext.append(f'===== PAGE {i} / {len(r.pages)} =====\n{page.extract_text() or "[NO TEXT]"}')
          (out/'pypdf.txt').write_text('\n\n'.join(pytext),encoding='utf-8')

          doc=pymupdf.open(str(p))
          fitz=[]
          for i,page in enumerate(doc,1):
              fitz.append(f'===== PAGE {i} / {len(doc)} =====\n{page.get_text("text",sort=True)}')
              pix=page.get_pixmap(matrix=pymupdf.Matrix(1.5,1.5),alpha=False)
              pix.save(out/f'pages/page-{i:02d}.png')
          (out/'pymupdf.txt').write_text('\n\n'.join(fitz),encoding='utf-8')
          print(f'RENDERED_PAGES={len(doc)}')

          dd=Document(str(d))
          problem=[]
          for para in dd.paragraphs:
              if para.text.strip(): problem.append(para.text)
          for ti,table in enumerate(dd.tables,1):
              problem.append(f'\n[TABLE {ti}]')
              for row in table.rows:
                  problem.append(' | '.join(cell.text.replace('\n',' / ') for cell in row.cells))
          (out/'problem.txt').write_text('\n'.join(problem),encoding='utf-8')
          print('PROBLEM_PREVIEW')
          print('\n'.join(problem)[:12000])
          PY
      - name: Upload study extraction
        uses: actions/upload-artifact@v4
        with:
          name: a21102480004-study-extraction
          path: /tmp/a21102480004/
          if-no-files-found: error
          retention-days: 1
