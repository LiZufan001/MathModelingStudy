name: Probe public Baidu 25 HuaweiCup share

on:
  push:
    paths:
      - '.github/workflows/probe-baidu-25huaweicup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify share and enumerate root
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, urllib.parse, urllib.request, http.cookiejar

          surl = 'NpT9h6UwwcB6SLFh2RAXzQ'
          pwd = '2kui'
          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36'

          init_url = 'https://pan.baidu.com/share/init?' + urllib.parse.urlencode({'surl': surl, 'pwd': pwd})
          req = urllib.request.Request(init_url, headers={'User-Agent': ua})
          try:
              with opener.open(req, timeout=30) as r:
                  init_body = r.read()
              print('INIT_OK', len(init_body), r.geturl(), r.headers.get('content-type'))
              print('INIT_COOKIES', [c.name for c in jar])
          except Exception as e:
              print('INIT_ERROR', type(e).__name__, repr(e))

          verify_url = 'https://pan.baidu.com/share/verify?' + urllib.parse.urlencode({
              'surl': surl,
              't': str(int(time.time()*1000)),
              'channel': 'chunlei',
              'web': '1',
              'app_id': '250528',
              'bdstoken': 'null',
              'clienttype': '0',
          })
          body = urllib.parse.urlencode({'pwd': pwd, 'vcode': '', 'vcode_str': ''}).encode()
          req = urllib.request.Request(verify_url, data=body, headers={
              'User-Agent': 'netdisk',
              'Referer': init_url,
              'Origin': 'https://pan.baidu.com',
              'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8',
          })
          verify = None
          try:
              with opener.open(req, timeout=30) as r:
                  raw = r.read().decode('utf-8', errors='replace')
              print('VERIFY_BODY', raw[:4000])
              verify = json.loads(raw)
              print('VERIFY_ERRNO', verify.get('errno'))
              print('VERIFY_KEYS', sorted(verify.keys()))
              print('VERIFY_COOKIES', [c.name for c in jar])
          except Exception as e:
              print('VERIFY_ERROR', type(e).__name__, repr(e))

          if isinstance(verify, dict) and verify.get('errno') == 0 and verify.get('randsk'):
              randsk = verify['randsk']
              # Some clients explicitly mirror randsk into BDCLND.
              from urllib.parse import urlparse
              cookie = http.cookiejar.Cookie(
                  version=0, name='BDCLND', value=randsk, port=None, port_specified=False,
                  domain='.baidu.com', domain_specified=True, domain_initial_dot=True,
                  path='/', path_specified=True, secure=True, expires=None, discard=True,
                  comment=None, comment_url=None, rest={}, rfc2109=False)
              jar.set_cookie(cookie)
              print('RANSK_LEN', len(randsk))

          endpoints = [
              ('GET', 'https://pan.baidu.com/share/wxlist?' + urllib.parse.urlencode({
                  'clienttype':'25','root':'1','shorturl':surl,'pwd':pwd
              }), None),
              ('POST', 'https://pan.baidu.com/share/wxlist?channel=weixin&version=2.2.2&clienttype=25&web=1',
               urllib.parse.urlencode({'shorturl':surl,'dir':'','root':'1','pwd':pwd}).encode()),
          ]
          for method, url, data in endpoints:
              print('LIST_TRY', method, url)
              req = urllib.request.Request(url, data=data, headers={
                  'User-Agent':'Mozilla/5.0 (Linux; Android 13; MicroMessenger) AppleWebKit/537.36 Mobile Safari/537.36 MicroMessenger/8.0',
                  'Referer': init_url,
                  'Content-Type':'application/x-www-form-urlencoded; charset=UTF-8',
              })
              try:
                  with opener.open(req, timeout=30) as r:
                      raw = r.read().decode('utf-8', errors='replace')
                  print('LIST_BODY_PREFIX', raw[:16000])
                  dataj = json.loads(raw)
                  print('LIST_ERRNO', dataj.get('errno'))
                  payload = dataj.get('data') if isinstance(dataj.get('data'), dict) else dataj
                  if dataj.get('errno') == 0:
                      print('LIST_SUCCESS')
                      print('META', json.dumps({k:payload.get(k) for k in ['shareid','share_id','uk','seckey','sekey'] if k in payload}, ensure_ascii=False))
                      items = payload.get('list') or []
                      print('ROOT_LIST_COUNT', len(items))
                      for item in items:
                          print('ROOT_ITEM', json.dumps({x:item.get(x) for x in ['fs_id','server_filename','path','isdir','size','md5']}, ensure_ascii=False))
              except Exception as e:
                  print('LIST_ERROR', method, type(e).__name__, repr(e))
          PY
