name: Probe CPMCM 2025 A Q3 Conv1 Single-Switch And Cycle Witness

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/q3-pipeline-20260911"
    paths:
      - ".github/workflows/probe-cpmcm-2025-a-q3-single-switch-cross-case.yml"

permissions:
  actions: read
  contents: read

jobs:
  conv1-bounded-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Sparse checkout 2025 A only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2025/A
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download accepted Conv1 Problem3 output
        uses: actions/download-artifact@v4
        with:
          name: cpmcm-2025-a-q3-conv1-formal-acceptance
          path: /tmp/source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34747404506
      - name: Probe gates
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest problems/CPMCM/2025/A/experiments/test_q3_critical_spill_switch.py -q
          python -m py_compile \
            problems/CPMCM/2025/A/experiments/probe_q3_single_switch_checkpoint.py \
            problems/CPMCM/2025/A/experiments/diagnose_q3_spill_cycle_blockers.py
      - name: Probe Conv1 top4 single-switch
        run: |
          python problems/CPMCM/2025/A/experiments/probe_q3_single_switch_checkpoint.py \
            --data-dir problems/CPMCM/2025/A/data/csv \
            --case Conv_Case1 \
            --input-dir /tmp/source/Conv_Case1 \
            --out-dir /tmp/q3-conv1-single-switch-top4 \
            --max-switches 4 \
            --expected-official 3767326
      - name: Diagnose Conv1 blocked batch prefixes
        run: |
          python problems/CPMCM/2025/A/experiments/diagnose_q3_spill_cycle_blockers.py \
            --data-dir problems/CPMCM/2025/A/data/csv \
            --case Conv_Case1 \
            --input-dir /tmp/source/Conv_Case1 \
            --out /tmp/q3-conv1-cycle-blockers.json \
            --max-switches 16 \
            --prefix-sizes 1,2,4,8,11
      - name: Upload Conv1 bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpmcm-2025-a-q3-conv1-bounded-probe
          path: |
            /tmp/q3-conv1-single-switch-top4
            /tmp/q3-conv1-cycle-blockers.json
          if-no-files-found: warn
