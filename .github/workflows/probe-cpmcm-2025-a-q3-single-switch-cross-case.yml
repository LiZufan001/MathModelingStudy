name: Continue CPMCM 2025 A Q3 Conv1 Cycle-Filtered Batch From 3752127

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/q3-pipeline-20260911"
    paths:
      - ".github/workflows/probe-cpmcm-2025-a-q3-single-switch-cross-case.yml"

permissions:
  actions: read
  contents: read

jobs:
  conv1-cycle-filtered-saturation-continuation-7:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Sparse checkout 2025 A only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2025/A
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download latest Conv1 saturation checkpoint
        uses: actions/download-artifact@v4
        with:
          name: cpmcm-2025-a-q3-conv1-cycle-filtered-saturation-continuation-6
          path: /tmp/source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35053304722
      - name: Saturation continuation gates
        run: |
          python -m py_compile \
            problems/CPMCM/2025/A/experiments/probe_q3_cycle_filtered_batch.py \
            problems/CPMCM/2025/A/experiments/probe_q3_cycle_filtered_batch_saturation.py \
            problems/CPMCM/2025/A/src/q3_spill_batch_optimizer.py
      - name: Continue fresh-rerank cycle-filtered batches until local saturation
        run: |
          python problems/CPMCM/2025/A/experiments/probe_q3_cycle_filtered_batch_saturation.py \
            --data-dir problems/CPMCM/2025/A/data/csv \
            --case Conv_Case1 \
            --input-dir /tmp/source/Problem3 \
            --out-dir /tmp/q3-conv1-cycle-filtered-saturation-continuation-7 \
            --expected-official 3752127 \
            --max-switches 16 \
            --max-rounds 8
      - name: Upload Conv1 continuation checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpmcm-2025-a-q3-conv1-cycle-filtered-saturation-continuation-7
          path: /tmp/q3-conv1-cycle-filtered-saturation-continuation-7
          if-no-files-found: warn
