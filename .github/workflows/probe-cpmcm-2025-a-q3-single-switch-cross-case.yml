name: Probe CPMCM 2025 A Q3 Conv1 Top4 After Spill 6334

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/q3-pipeline-20260911"
    paths:
      - ".github/workflows/probe-cpmcm-2025-a-q3-single-switch-cross-case.yml"

permissions:
  actions: read
  contents: read

jobs:
  conv1-top4-after-6334:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Sparse checkout 2025 A only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2025/A
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download saturated spill 6334 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: cpmcm-2025-a-q3-conv1-targeted-6334
          path: /tmp/source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34773483500
      - name: Probe gates
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest problems/CPMCM/2025/A/experiments/test_q3_critical_spill_switch.py -q
          python -m py_compile problems/CPMCM/2025/A/experiments/probe_q3_single_switch_checkpoint.py
      - name: Probe Conv1 top4 single-switch once
        run: |
          python problems/CPMCM/2025/A/experiments/probe_q3_single_switch_checkpoint.py \
            --data-dir problems/CPMCM/2025/A/data/csv \
            --case Conv_Case1 \
            --input-dir /tmp/source/Problem3 \
            --out-dir /tmp/q3-conv1-top4-after-6334 \
            --max-switches 4 \
            --expected-official 3765227
      - name: Upload Conv1 top4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpmcm-2025-a-q3-conv1-top4-after-6334
          path: /tmp/q3-conv1-top4-after-6334
          if-no-files-found: warn
