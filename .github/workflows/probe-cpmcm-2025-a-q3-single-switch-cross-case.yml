name: Diagnose CPMCM 2025 A Q3 Conv1 Spill 6565 Cycle

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/q3-pipeline-20260911"
    paths:
      - ".github/workflows/probe-cpmcm-2025-a-q3-single-switch-cross-case.yml"

permissions:
  actions: read
  contents: read

jobs:
  conv1-cycle-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sparse checkout 2025 A only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2025/A
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download current Conv1 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: cpmcm-2025-a-q3-conv1-cycle-aware
          path: /tmp/source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34773837415
      - name: Diagnose rank-1 spill reversal cycle
        run: |
          python problems/CPMCM/2025/A/experiments/diagnose_q3_spill_cycle_blockers.py \
            --data-dir problems/CPMCM/2025/A/data/csv \
            --case Conv_Case1 \
            --input-dir /tmp/source/next \
            --out /tmp/q3-conv1-cycle-diagnosis.json \
            --max-switches 1 \
            --prefix-sizes 1
      - name: Upload Conv1 cycle diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpmcm-2025-a-q3-conv1-cycle-diagnosis
          path: /tmp/q3-conv1-cycle-diagnosis.json
          if-no-files-found: warn
