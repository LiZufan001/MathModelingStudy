name: Probe CPMCM 2025 A Q3 Conv1 Cycle-Filtered Batch

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/q3-pipeline-20260911"
    paths:
      - ".github/workflows/probe-cpmcm-2025-a-q3-single-switch-cross-case.yml"

permissions:
  actions: read
  contents: read

jobs:
  conv1-cycle-filtered-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Sparse checkout 2025 A only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2025/A
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download coordinate-saturated Conv1 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: cpmcm-2025-a-q3-conv1-coordinate
          path: /tmp/source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34774088910
      - name: Cycle-filtered batch gates
        run: |
          python -m py_compile \
            problems/CPMCM/2025/A/experiments/probe_q3_cycle_filtered_batch.py \
            problems/CPMCM/2025/A/src/q3_spill_batch_optimizer.py
      - name: Probe cycle-filtered critical-SPILL prefixes
        run: |
          python problems/CPMCM/2025/A/experiments/probe_q3_cycle_filtered_batch.py \
            --data-dir problems/CPMCM/2025/A/data/csv \
            --case Conv_Case1 \
            --input-dir /tmp/source/next \
            --out-dir /tmp/q3-conv1-cycle-filtered-batch \
            --expected-official 3765227 \
            --max-switches 16
      - name: Upload Conv1 cycle-filtered batch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpmcm-2025-a-q3-conv1-cycle-filtered-batch
          path: /tmp/q3-conv1-cycle-filtered-batch
          if-no-files-found: warn
