name: Continue CPMCM 2025 A Q3 Conv1 Single-Switch Checkpoint

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/q3-pipeline-20260911"
    paths:
      - ".github/workflows/probe-cpmcm-2025-a-q3-single-switch-cross-case.yml"

permissions:
  actions: read
  contents: read

jobs:
  conv1-single-switch-continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Sparse checkout 2025 A only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2025/A
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download Conv1 top4 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: cpmcm-2025-a-q3-conv1-bounded-probe
          path: /tmp/source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34749221776
      - name: Continuation gates
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest problems/CPMCM/2025/A/experiments/test_q3_critical_spill_switch.py -q
          python -m py_compile \
            problems/CPMCM/2025/A/experiments/probe_q3_single_switch_checkpoint.py \
            problems/CPMCM/2025/A/experiments/probe_q3_single_switch_saturation.py
      - name: Continue Conv1 for up to four checkpointed rounds
        run: |
          python problems/CPMCM/2025/A/experiments/probe_q3_single_switch_saturation.py \
            --data-dir problems/CPMCM/2025/A/data/csv \
            --case Conv_Case1 \
            --input-dir /tmp/source/q3-conv1-single-switch-top4/next \
            --out-dir /tmp/q3-conv1-single-switch-continuation \
            --max-switches 4 \
            --max-rounds 4 \
            --expected-official 3767174
      - name: Upload Conv1 continuation checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpmcm-2025-a-q3-conv1-single-switch-continuation
          path: /tmp/q3-conv1-single-switch-continuation
          if-no-files-found: warn
