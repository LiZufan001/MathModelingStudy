name: Probe CPMCM 2025 A Q3 Conv1 Saturated Diagnostic

on:
  push:
    branches:
      - "agent/q3-pipeline-20260911"
    paths:
      - "problems/CPMCM/2025/A/experiments/diagnose_q3_conv1_saturated.py"
      - ".github/workflows/probe-cpmcm-2025-a-q3-conv1-saturated-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conv1-saturated-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Sparse checkout 2025 A only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2025/A
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile diagnostic
        run: python -m py_compile problems/CPMCM/2025/A/experiments/diagnose_q3_conv1_saturated.py
      - name: Rebuild saturated Conv1 and classify critical path
        run: |
          python problems/CPMCM/2025/A/experiments/diagnose_q3_conv1_saturated.py \
            --case Conv_Case1 \
            --data-dir problems/CPMCM/2025/A/data/csv \
            --out /tmp/q3-conv1-saturated-diagnostic.json \
            --recolor-rounds 24
      - name: Upload saturated replay and diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: cpmcm-2025-a-q3-conv1-saturated-diagnostic
          path: /tmp/q3-conv1-saturated-diagnostic.json
          if-no-files-found: error
