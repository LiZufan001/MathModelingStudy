name: Import official CUMCM 2022-2025 problems

on:
  push:
    paths:
      - '.github/workflows/import-cumcm-2022-2025.yml'
      - 'scripts/import_cumcm_official.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-problems:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install archive tools
        shell: bash
        run: |
          set -euo pipefail

          # The hosted runner can contain unrelated third-party apt sources.
          # If one of those is temporarily broken (for example Azure CLI), it
          # must not prevent this job from installing ordinary Ubuntu packages.
          for f in /etc/apt/sources.list.d/*; do
            if [ -f "$f" ] && grep -q 'packages.microsoft.com' "$f"; then
              sudo mv "$f" "$f.disabled"
            fi
          done

          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full unar

      - name: Download official problem archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cumcm

          curl -fL --retry 3 --retry-delay 2 \
            -A 'Mozilla/5.0' \
            -e 'https://www.mcm.edu.cn/html_cn/node/388239ded4b057d37b7b8e51e33fe903.html' \
            'https://www.mcm.edu.cn/upload_cn/node/670/5eWlbmTt28f88a0815a79d555da8b7072f971633.rar' \
            -o /tmp/cumcm/CUMCM2022Problems.rar

          curl -fL --retry 3 --retry-delay 2 \
            -A 'Mozilla/5.0' \
            -e 'https://www.mcm.edu.cn/html_cn/node/c74d72127066f510a5723a94b5323a26.html' \
            'https://www.mcm.edu.cn/upload_cn/node/690/Y20WPner9fa62862794e6dc82731a5561ce1132f.rar' \
            -o /tmp/cumcm/CUMCM2023Problems.rar

          curl -fL --retry 3 --retry-delay 2 \
            -A 'Mozilla/5.0' \
            -e 'https://www.mcm.edu.cn/html_cn/node/a0c1fb5c31d43551f08cd8ad16870444.html' \
            'https://www.mcm.edu.cn/upload_cn/node/725/pmkWxf8H9cfe9984c1a1a5b1263e5dd3b5596ed5.zip' \
            -o /tmp/cumcm/CUMCM2024Problems.zip

          curl -fL --retry 3 --retry-delay 2 \
            -A 'Mozilla/5.0' \
            -e 'https://www.mcm.edu.cn/html_cn/node/03c91a444e62eee81a3740fa97a461a6.html' \
            'https://www.mcm.edu.cn/upload_cn/node/759/SvpohSGacdffe718bcaa3b6e835c03ae3461cab1.zip' \
            -o /tmp/cumcm/CUMCM2025Problems.zip

          echo 'Downloaded official archives to temporary runner storage:'
          ls -lh /tmp/cumcm

          for f in /tmp/cumcm/*; do
            bytes=$(stat -c%s "$f")
            if [ "$bytes" -lt 1024 ]; then
              echo "Archive is unexpectedly small: $f ($bytes bytes)" >&2
              exit 1
            fi
          done

      - name: Build GitHub-sized official study set
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/import_cumcm_official.py

          echo 'Repository payload after filtering:'
          du -sh problems/CUMCM
          find problems/CUMCM -type f -printf '%s %p\n' | sort -nr | head -30

          too_large=$(find problems/CUMCM -type f -size +25M -print -quit)
          if [ -n "$too_large" ]; then
            echo "Unexpected file over 25 MiB remained in repository payload: $too_large" >&2
            exit 1
          fi

      - name: Commit imported problems and attachment manifests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config http.postBuffer 157286400

          git add problems/CUMCM
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'data: import compact official CUMCM 2022-2025 set'
            git push
          fi
