name: Test CPMCM 2025 A Q3 Spill Switch Batch

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/q3-pipeline-20260911"
    paths:
      - "problems/CPMCM/2025/A/experiments/q3_critical_spill_switch_batch.py"
      - "problems/CPMCM/2025/A/experiments/test_q3_critical_spill_switch_batch.py"
      - ".github/workflows/test-cpmcm-2025-a-q3-spill-switch-batch.yml"

permissions:
  contents: read

jobs:
  batch-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sparse checkout 2025 A only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2025/A
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Batched critical spill switch tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest \
            problems/CPMCM/2025/A/experiments/test_q3_critical_spill_switch.py \
            problems/CPMCM/2025/A/experiments/test_q3_critical_spill_switch_batch.py \
            -q
