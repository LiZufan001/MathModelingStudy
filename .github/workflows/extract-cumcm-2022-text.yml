name: Extract CUMCM 2022 PDFs to text

on:
  push:
    paths:
      - '.github/workflows/extract-cumcm-2022-text.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract PDF text
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p problems/CUMCM/2022/analysis/source_text

          if command -v pdftotext >/dev/null 2>&1; then
            pdftotext -layout \
              'problems/CUMCM/2022/official/A题/A题/A题.pdf' \
              'problems/CUMCM/2022/analysis/source_text/problem_A_official.txt'
            pdftotext -layout \
              'problems/CUMCM/2022/papers/national_first/2022-A-浙江大学-国一.pdf' \
              'problems/CUMCM/2022/analysis/source_text/paper_ZJU_national_first.txt'
          else
            python -m pip install --quiet pypdf
            python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader

          items = [
              (Path('problems/CUMCM/2022/official/A题/A题/A题.pdf'),
               Path('problems/CUMCM/2022/analysis/source_text/problem_A_official.txt')),
              (Path('problems/CUMCM/2022/papers/national_first/2022-A-浙江大学-国一.pdf'),
               Path('problems/CUMCM/2022/analysis/source_text/paper_ZJU_national_first.txt')),
          ]
          for src, dst in items:
              reader = PdfReader(str(src))
              parts = []
              for i, page in enumerate(reader.pages, 1):
                  parts.append(f'\n===== PAGE {i} =====\n')
                  parts.append(page.extract_text() or '')
              dst.write_text(''.join(parts), encoding='utf-8')
          PY
          fi

          test -s problems/CUMCM/2022/analysis/source_text/problem_A_official.txt
          test -s problems/CUMCM/2022/analysis/source_text/paper_ZJU_national_first.txt

      - name: Commit extracted text
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add problems/CUMCM/2022/analysis/source_text
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'analysis: add extracted text for CUMCM 2022 A'
            git push
          fi
