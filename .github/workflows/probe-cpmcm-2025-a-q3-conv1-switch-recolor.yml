name: Probe CPMCM 2025 A Q3 Conv1 Switch Recolor

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/q3-pipeline-20260911"
    paths:
      - "problems/CPMCM/2025/A/experiments/q3_critical_spill_switch_recipe.py"
      - "problems/CPMCM/2025/A/experiments/test_q3_critical_spill_switch_recipe.py"
      - "problems/CPMCM/2025/A/experiments/benchmark_q3_switch_recolor_snapshot.py"
      - "problems/CPMCM/2025/A/experiments/snapshots/q3_conv1_saturated_switch_recipe.json"
      - ".github/workflows/probe-cpmcm-2025-a-q3-conv1-switch-recolor.yml"

permissions:
  contents: read

jobs:
  switch-recolor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sparse checkout 2025 A only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2025/A
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synthetic replay and recolor gates
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest \
            problems/CPMCM/2025/A/experiments/test_q3_critical_spill_switch.py \
            problems/CPMCM/2025/A/experiments/test_q3_critical_spill_switch_recipe.py \
            problems/CPMCM/2025/A/tests/test_q3_conv_local_recolor.py \
            problems/CPMCM/2025/A/tests/test_q3_conv_greedy_recolor.py \
            -q
      - name: Replay strict switch then shallow recolor
        run: |
          python problems/CPMCM/2025/A/experiments/benchmark_q3_switch_recolor_snapshot.py \
            --data-dir problems/CPMCM/2025/A/data/csv \
            --snapshot problems/CPMCM/2025/A/experiments/snapshots/q3_conv1_saturated_offsets.json \
            --recipe problems/CPMCM/2025/A/experiments/snapshots/q3_conv1_saturated_switch_recipe.json \
            --out /tmp/q3-conv1-switch-recolor.json \
            --recolor-rounds 3 \
            --recolor-targets 6 \
            --recolor-starts 12
      - name: Upload switch+recolor evidence
        uses: actions/upload-artifact@v4
        with:
          name: cpmcm-2025-a-q3-conv1-switch-recolor
          path: /tmp/q3-conv1-switch-recolor.json
          if-no-files-found: error
