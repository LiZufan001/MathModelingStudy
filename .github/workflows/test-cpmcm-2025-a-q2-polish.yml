name: Test CPMCM 2025 A Q2 Polish Portfolio

on:
  push:
    branches:
      - "agent/q3-pipeline-20260911"
    paths:
      - "problems/CPMCM/2025/A/experiments/benchmark_q2_polish_portfolio.py"
      - ".github/workflows/test-cpmcm-2025-a-q2-polish.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  q2-polish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sparse checkout 2025 A only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2025/A
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Focused Q2 and tradeoff-scheduler regression tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest \
            problems/CPMCM/2025/A/tests/test_q2.py \
            problems/CPMCM/2025/A/tests/test_q3_tradeoff_scheduler.py \
            -q
      - name: Benchmark strict Q2 polish portfolio
        run: |
          python problems/CPMCM/2025/A/experiments/benchmark_q2_polish_portfolio.py \
            --data-dir problems/CPMCM/2025/A/data/csv \
            --out-dir /tmp/q2-polish
          test -s /tmp/q2-polish/q2_polish_winners.csv
          test -s /tmp/q2-polish/q2_polish_summary.json
      - name: Upload Q2 polish evidence
        uses: actions/upload-artifact@v4
        with:
          name: cpmcm-2025-a-q2-polish
          path: /tmp/q2-polish
          if-no-files-found: error
