name: Test CPMCM 2025 A Q2 Transfer-Aware Window

on:
  push:
    branches:
      - "agent/q3-pipeline-20260911"
    paths:
      - "problems/CPMCM/2025/A/experiments/q2_transfer_aware_window.py"
      - "problems/CPMCM/2025/A/experiments/test_q2_transfer_aware_window.py"
      - "problems/CPMCM/2025/A/experiments/benchmark_q2_transfer_aware.py"
      - ".github/workflows/test-cpmcm-2025-a-q2-transfer-aware-window.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer-aware-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sparse checkout 2025 A only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2025/A
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile transfer-aware benchmark
        run: |
          python -m py_compile problems/CPMCM/2025/A/experiments/benchmark_q2_transfer_aware.py
      - name: Transfer-aware window tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest problems/CPMCM/2025/A/experiments/test_q2_transfer_aware_window.py -q
