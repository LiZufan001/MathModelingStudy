name: Test CPMCM 2025 A Q3 Refined Frontier Reconciliation

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/q3-pipeline-20260911"
    paths:
      - "problems/CPMCM/2025/A/experiments/reconcile_q3_refined_frontier.py"
      - "problems/CPMCM/2025/A/tests/test_reconcile_q3_refined_frontier.py"
      - ".github/workflows/test-cpmcm-2025-a-q3-reconcile.yml"

permissions:
  contents: read

jobs:
  reconcile-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sparse checkout 2025 A only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2025/A
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconciliation unit tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest problems/CPMCM/2025/A/tests/test_reconcile_q3_refined_frontier.py -q
          python -m py_compile problems/CPMCM/2025/A/experiments/reconcile_q3_refined_frontier.py
