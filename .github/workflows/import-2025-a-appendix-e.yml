name: Import 2025 A Appendix E datasets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-2025-a-appendix-e.yml'

permissions:
  contents: write

jobs:
  import-data:
    if: "${{ github.event.head_commit.message == 'chore: bootstrap 2025 A appendix E import' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download pinned public copies
        shell: bash
        run: |
          set -euo pipefail
          JSON_COMMIT='b3f47fb07ef247cf82f4cb5d2e876983a84d3ace'
          CSV_COMMIT='da007ef7893caedefbeea47e4ef13fc41e837062'
          base='problems/CPMCM/2025/A/data'
          mkdir -p "$base/json" "$base/csv"
          cases=(Matmul_Case0 Matmul_Case1 FlashAttention_Case0 FlashAttention_Case1 Conv_Case0 Conv_Case1)
          for name in "${cases[@]}"; do
            curl --fail --location --retry 3 \
              "https://raw.githubusercontent.com/1357570890/NPU-Operator-Scheduler/${JSON_COMMIT}/data_generation/${name}.json" \
              -o "$base/json/${name}.json"
            curl --fail --location --retry 3 \
              "https://raw.githubusercontent.com/nsyw705/2025-MM/${CSV_COMMIT}/${name}_Nodes.csv" \
              -o "$base/csv/${name}_Nodes.csv"
            curl --fail --location --retry 3 \
              "https://raw.githubusercontent.com/nsyw705/2025-MM/${CSV_COMMIT}/${name}_Edges.csv" \
              -o "$base/csv/${name}_Edges.csv"
          done

      - name: Validate JSON and CSV against Appendix E
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          base = Path('problems/CPMCM/2025/A/data')
          expected = {
              'Matmul_Case0': (4160, 7104),
              'Matmul_Case1': (30976, 55040),
              'FlashAttention_Case0': (1716, 2712),
              'FlashAttention_Case1': (6952, 11184),
              'Conv_Case0': (2580, 3869),
              'Conv_Case1': (36086, 85653),
          }

          rows = []
          for name, (expected_nodes, expected_edges) in expected.items():
              with (base / 'json' / f'{name}.json').open(encoding='utf-8-sig') as f:
                  graph = json.load(f)
              json_nodes = len(graph['Nodes'])
              json_edges = len(graph['Edges'])

              with (base / 'csv' / f'{name}_Nodes.csv').open(encoding='utf-8-sig', newline='') as f:
                  csv_nodes = sum(1 for _ in csv.reader(f)) - 1
              with (base / 'csv' / f'{name}_Edges.csv').open(encoding='utf-8-sig', newline='') as f:
                  csv_edges = sum(1 for _ in csv.reader(f)) - 1

              actual = (json_nodes, json_edges, csv_nodes, csv_edges)
              wanted = (expected_nodes, expected_edges, expected_nodes, expected_edges)
              if actual != wanted:
                  raise SystemExit(f'{name}: expected {wanted}, got {actual}')
              rows.append((name, json_nodes, json_edges))

          readme = base / 'README.md'
          lines = [
              '# 2025 A题 · 附录 E 示例计算图数据',
              '',
              '本目录补充 A 题《通用神经网络处理器下的核内调度问题》附录 E 所述的 6 个示例计算图。',
              '',
              '## 目录',
              '',
              '- `json/`：6 个 `<任务名>.json` 文件。',
              '- `csv/`：12 个 CSV 文件，每个任务分别为 `<任务名>_Nodes.csv` 与 `<任务名>_Edges.csv`。',
              '',
              'JSON 与 CSV 仅文件格式不同，导入时已逐项校验节点数、边数一致，并与附录 E 表 2 一致。',
              '',
              '| 任务 | 节点数 | 依赖边数 |',
              '| --- | ---: | ---: |',
          ]
          lines += [f'| {name} | {nodes} | {edges} |' for name, nodes, edges in rows]
          lines += [
              '',
              '## 来源',
              '',
              '- JSON 公共副本：`1357570890/NPU-Operator-Scheduler`，固定 commit `b3f47fb07ef247cf82f4cb5d2e876983a84d3ace`，路径 `data_generation/`。',
              '- CSV 公共副本：`nsyw705/2025-MM`，固定 commit `da007ef7893caedefbeea47e4ef13fc41e837062`。',
              '- 题面依据：2025 年第二十二届中国研究生数学建模竞赛 A 题附录 E《示例计算图数据格式及提交附件格式说明》。',
              '',
              '> 说明：比赛平台原始下载入口已过赛期关闭，因此这里采用公开留存副本；通过文件名、数据结构以及附录 E 表 2 的六组节点/边数量进行交叉核验。',
              '',
          ]
          readme.write_text('\n'.join(lines), encoding='utf-8')
          PY

      - name: Update 2025 index note
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('problems/CPMCM/2025/README.md')
          text = p.read_text(encoding='utf-8')
          old = '- 本次 `2025.zip` 中未发现独立的数据附件文件，因此当前仅收录题面；后续若找到官方独立附件，再按题号补入对应目录'
          new = '- A 题已补齐附录 E 的示例计算图数据：6 个 JSON + 12 个 CSV，见 [`A/data/`](A/data/README.md)'
          if old not in text:
              raise SystemExit('Expected old README note not found; refusing blind edit')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit imported datasets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add problems/CPMCM/2025/A/data problems/CPMCM/2025/README.md
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m 'data: add 2025 A appendix E graph datasets'
          git push origin HEAD:main
