name: Patch 2025 D study roadmap
on:
  push:
    paths:
      - '.github/workflows/patch-2025-d-study-roadmap.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch roadmap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('papers/CPMCM/study/README.md')
          s=p.read_text(encoding='utf-8')
          old='| 11 | 2025 D | 辽宁工程技术大学 石彤彤/赵其伟/安雪菱 | 环境场估计、风险量化、航路优化 | ⏳ 待确认全文 |'
          new='| 11 | 2025 D | 辽宁工程技术大学 石彤彤/赵其伟/安雪菱 | 环境场估计、风险量化、航路优化 | 🟡 证据重构，待封面核验 |'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('roadmap row not found')
          marker='## 11. 2025 D｜ac2d33da18fa 候选（证据级深读）'
          if marker not in s:
              s += '''\n\n## 11. 2025 D｜ac2d33da18fa 候选（证据级深读）\n\n> **身份边界：**60 页候选《低空湍流监测及最优航路规划研究》与辽宁工程技术大学石彤彤/赵其伟/安雪菱团队国一作品《低空湍流监测与最优航路规划研究》仅“及/与”一字差异，对应国一候选编号 `D25101470116`；但尚未看到候选 PDF 封面队号，所以不计为 exact-match 全文。\n\n- [`2025-D-ac2d33da18fa/README.md`](2025-D-ac2d33da18fa/README.md)：a→b→c→d/e→route 证据级深读\n- [`2025-D-ac2d33da18fa/MODEL_RECONSTRUCTION.md`](2025-D-ac2d33da18fa/MODEL_RECONSTRUCTION.md)：probabilistic turbulence state → forecast → chance/CVaR route 重构\n- [`2025-D-ac2d33da18fa/TURBULENCE_TO_ROUTE_AUDIT.md`](2025-D-ac2d33da18fa/TURBULENCE_TO_ROUTE_AUDIT.md)：量纲、伪分辨率、验证、NWP、路径最优性专项审计\n- [`2025-D-ac2d33da18fa/REVIEWER_REPORT.md`](2025-D-ac2d33da18fa/REVIEWER_REPORT.md)：模拟评审与 16 个答辩问题\n- [`2025-D-ac2d33da18fa/COMPETITION_PLAYBOOK.md`](2025-D-ac2d33da18fa/COMPETITION_PLAYBOOK.md)：多源监测→三维场→短临→风险航路速查\n- [`2025-D-ac2d33da18fa/SOURCE_PROVENANCE.md`](2025-D-ac2d33da18fa/SOURCE_PROVENANCE.md)：候选身份、SHA 与全文恢复核查\n'''
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'LiZufan001'
          git config user.email '128899229+LiZufan001@users.noreply.github.com'
          git add papers/CPMCM/study/README.md
          git diff --cached --quiet && exit 0
          git commit -m 'study: record provisional 2025 D deep-read status'
          git push
