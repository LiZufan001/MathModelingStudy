name: Extract CUMCM 2023 B sources to text

on:
  push:
    paths:
      - '.github/workflows/extract-cumcm-2023-b-text.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils python3-openpyxl
      - name: Extract PDFs and workbook
        run: |
          set -euo pipefail
          mkdir -p problems/CUMCM/2023/analysis/source_text
          pdftotext -layout 'problems/CUMCM/2023/official/B题/B题.pdf' 'problems/CUMCM/2023/analysis/source_text/problem_B_official.txt'
          pdftotext -layout 'problems/CUMCM/2023/papers/national_first/2023-B-南京邮电大学-基于区域划分的多波束测线布设-国一-赛后发表版.pdf' 'problems/CUMCM/2023/analysis/source_text/paper_NJUPT_national_first_B_published.txt'
          python3 - <<'PY'
          from openpyxl import load_workbook
          from pathlib import Path
          src = Path('problems/CUMCM/2023/official/B题/附件.xlsx')
          out = Path('problems/CUMCM/2023/analysis/source_text/problem_B_attachment.txt')
          wb = load_workbook(src, data_only=True, read_only=True)
          with out.open('w', encoding='utf-8') as f:
              f.write(f'Workbook: {src}\n')
              f.write('Sheets: ' + ', '.join(wb.sheetnames) + '\n\n')
              for ws in wb.worksheets:
                  f.write(f'=== SHEET {ws.title} rows={ws.max_row} cols={ws.max_column} ===\n')
                  for row in ws.iter_rows(values_only=True):
                      vals = ['' if v is None else str(v) for v in row]
                      f.write('\t'.join(vals).rstrip() + '\n')
                  f.write('\n')
          PY
      - name: Commit extracted sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add problems/CUMCM/2023/analysis/source_text/problem_B_official.txt \
                  problems/CUMCM/2023/analysis/source_text/paper_NJUPT_national_first_B_published.txt \
                  problems/CUMCM/2023/analysis/source_text/problem_B_attachment.txt
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'data: extract CUMCM 2023 B sources to text'
            git push
          fi
