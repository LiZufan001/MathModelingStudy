name: Probe 2025 D paper provenance
on:
  push:
    paths:
      - '.github/workflows/probe-2025-d-ac2d33.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Search source repository history for candidate PDF
        shell: bash
        run: |
          set -euo pipefail
          git clone --mirror https://github.com/yan315598-design/mathmodel-studio.git /tmp/mmstudio.git
          cd /tmp/mmstudio.git
          echo '=== PATH SEARCH ==='
          git rev-list --objects --all | grep -F 'D题-低空湍流监测及最优航路规划研究' || true
          echo '=== PDF-LIKE OBJECT PATHS ==='
          git rev-list --objects --all | grep -E '2025.*D.*\.pdf|D题优秀论文.*\.pdf|低空湍流.*\.pdf' || true
          echo '=== REFS ==='
          git show-ref || true
