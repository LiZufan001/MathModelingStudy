name: Probe CPMCM 2025 A Q3 Conv1 Formal Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/q3-pipeline-20260911"
    paths:
      - "problems/CPMCM/2025/A/experiments/accept_q3_conv1_formal_from_saturated.py"
      - "problems/CPMCM/2025/A/experiments/snapshots/q3_conv1_saturated_offsets.json"
      - ".github/workflows/probe-cpmcm-2025-a-q3-conv1-formal-acceptance.yml"

permissions:
  contents: read

jobs:
  conv1-formal-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Sparse checkout 2025 A only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2025/A
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Formal Conv1 gates
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest \
            problems/CPMCM/2025/A/tests/test_q3_evaluator.py \
            problems/CPMCM/2025/A/tests/test_q3_official_optimizer.py \
            problems/CPMCM/2025/A/tests/test_q3_spill_batch_optimizer.py \
            problems/CPMCM/2025/A/tests/test_q3_official_spill_optimizer.py \
            -q
          python -m py_compile problems/CPMCM/2025/A/experiments/accept_q3_conv1_formal_from_saturated.py
      - name: Rebuild deterministic saturated Conv1 and run formal spill batches
        run: |
          python problems/CPMCM/2025/A/experiments/accept_q3_conv1_formal_from_saturated.py \
            --data-dir problems/CPMCM/2025/A/data/csv \
            --snapshot problems/CPMCM/2025/A/experiments/snapshots/q3_conv1_saturated_offsets.json \
            --max-rounds 12 \
            --out-dir /tmp/q3-conv1-formal-acceptance
      - name: Upload formal Conv1 evidence and Problem3 outputs
        uses: actions/upload-artifact@v4
        with:
          name: cpmcm-2025-a-q3-conv1-formal-acceptance
          path: /tmp/q3-conv1-formal-acceptance
          if-no-files-found: error
