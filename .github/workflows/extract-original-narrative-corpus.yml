name: Extract original narrative corpus
on:
  push:
    paths:
      - '.github/workflows/extract-original-narrative-corpus.yml'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract narrative sections from exact-match papers
        shell: bash
        run: |
          python -m pip install --quiet pypdf pymupdf fonttools
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          import fitz, re, subprocess, tempfile
          from collections import Counter

          papers = [
              ('2022-C-C22106140003', 'papers/CPMCM/2022/fulltext/C/C22106140003.pdf'),
              ('2020-F-F20102840100', 'papers/CPMCM/2020/fulltext/F/F20102840100.pdf'),
              ('2021-A-A21102480004', 'papers/CPMCM/2021/fulltext/A/A21102480004.pdf'),
              ('2024-B-B24102860287', 'papers/CPMCM/2024/fulltext/B/B24102860287.pdf'),
              ('2023-B-B23104860044', 'papers/CPMCM/2023/fulltext/B/B23104860044.pdf'),
              ('2022-B-B22106140009', 'papers/CPMCM/2022/fulltext/B/B22106140009.pdf'),
              ('2020-C-C20102860127', 'papers/CPMCM/2020/fulltext/C/C20102860127.pdf'),
              ('2024-F-F24104860143', 'papers/CPMCM/2024/fulltext/F/F24104860143.pdf'),
              ('2024-E-E24102910005', 'papers/CPMCM/2024/fulltext/E/E24102910005.pdf'),
          ]
          heading_patterns = [
              r'摘\s*要', r'问题[一二三四五12345].{0,10}分析', r'问题分析',
              r'结果分析', r'实验结果', r'模型.{0,8}(评价|评估|总结|优点|缺点)',
              r'总结与评价', r'结\s*论', r'模型的推广', r'模型推广'
          ]
          connector_terms = [
              '考虑到','由于','因此','故','由此','在此基础上','进一步','为了','针对',
              '根据','结合','首先','其次','最后','结果表明','结果显示','由表','由图','可见',
              '说明','相比','然而','但是','同时','从而','进而','综上','不是','而是'
          ]

          def safe(s):
              return (s or '').replace('\x00','').encode('utf-8','replace').decode('utf-8')
          def cjk_score(s):
              cjk=sum(1 for ch in s if '\u4e00' <= ch <= '\u9fff')
              bad=s.count('�') + sum(1 for ch in s if 0xE000 <= ord(ch) <= 0xF8FF)
              return cjk - 4*bad
          def extract_fitz(path):
              doc=fitz.open(path); return [safe(p.get_text('text')) for p in doc]
          def extract_pypdf(path):
              r=PdfReader(path); out=[]
              for p in r.pages:
                  try: out.append(safe(p.extract_text() or ''))
                  except Exception as e: out.append(f'[EXTRACT_ERROR {e}]')
              return out
          def extract_pdftotext(path):
              # layout-preserving whole extraction; split by form feed
              try:
                  cp=subprocess.run(['pdftotext','-layout',path,'-'],check=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
                  txt=safe(cp.stdout.decode('utf-8','replace'))
                  return txt.split('\f')
              except Exception:
                  return []
          def choose(path):
              cands=[]
              for name,fn in [('fitz',extract_fitz),('pypdf',extract_pypdf),('pdftotext',extract_pdftotext)]:
                  try:
                      pages=fn(path)
                      whole='\n'.join(pages)
                      cands.append((cjk_score(whole), name, pages, whole))
                  except Exception as e:
                      print(f'@@EXTRACTOR_FAIL {path} {name} {safe(str(e))}')
              cands.sort(key=lambda x:x[0], reverse=True)
              return cands[0], [(n,sc,len(w)) for sc,n,p,w in cands]

          all_rows=[]
          for pid,path in papers:
              if not Path(path).exists():
                  print(f'@@MISSING {pid} {path}'); continue
              (score, extractor, pages, whole),scores=choose(path)
              print('\n'+'='*100)
              print(f'@@PAPER {pid} pages={len(pages)} chars={len(whole)} extractor={extractor} score={score}')
              print('@@EXTRACTOR_SCORES '+safe(str(scores)))
              counts={t:whole.count(t) for t in connector_terms}
              print('@@CONNECTOR_COUNTS '+' '.join(f'{k}={v}' for k,v in counts.items()))
              contrast=[]
              for m in re.finditer(r'[^。！？\n]{0,70}不是[^。！？\n]{0,80}而是[^。！？\n]{0,100}[。！？]?',whole):
                  contrast.append(safe(m.group(0).strip()))
              print(f'@@NOT_BUT_COUNT {len(contrast)}')
              for s in contrast[:8]: print('@@NOT_BUT_EXAMPLE '+safe(s[:320]))

              selected=[]; seen=set()
              # front/abstract candidates
              for i in range(min(4,len(pages))):
                  if i>=1: selected.append((i+1,'FRONT_OR_ABSTRACT',pages[i]))
              # sections by headings
              for i,txt in enumerate(pages):
                  hits=[pat for pat in heading_patterns if re.search(pat,txt)]
                  if hits: selected.append((i+1,'|'.join(hits),txt))
              chosen=[]
              for x in selected:
                  if x[0] not in seen:
                      seen.add(x[0]); chosen.append(x)
              for pg,why,txt in chosen[:18]:
                  compact=safe(re.sub(r'\s+',' ',txt).strip())
                  print(f'@@SECTION page={pg} reason={why}')
                  print(compact[:5500])
                  print('@@END_SECTION')
              all_rows.append((pid,len(whole),counts,len(contrast),extractor,score))

          print('\n'+'#'*100+'\n@@CORPUS_SUMMARY')
          totals=Counter(); total_chars=0; total_nb=0
          for pid,n,c,nb,ext,score in all_rows:
              total_chars+=n; total_nb+=nb; totals.update(c)
          print(f'papers={len(all_rows)} chars={total_chars} not_but={total_nb}')
          for t in connector_terms:
              print(f'{t}\t{totals[t]}\tper10k={totals[t]/max(total_chars,1)*10000:.3f}')
          PY
