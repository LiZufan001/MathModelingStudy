name: Audit CPMCM 2025 A Q3 Conv1 Promotion

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/q3-pipeline-20260911"
    paths:
      - "problems/CPMCM/2025/A/experiments/audit_q3_candidate_promotion.py"
      - ".github/workflows/audit-cpmcm-2025-a-q3-conv1-promotion.yml"

permissions:
  contents: read
  actions: read

jobs:
  promotion-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Sparse checkout 2025 A only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2025/A
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download saturated iterative candidate
        uses: actions/download-artifact@v4
        with:
          name: cpmcm-2025-a-q3-conv1-iterative-batch
          path: /tmp/candidate
          github-token: ${{ github.token }}
          repository: LiZufan001/MathModelingStudy
          run-id: 34743831756
      - name: Promotion audit gates
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m py_compile problems/CPMCM/2025/A/experiments/audit_q3_candidate_promotion.py
          python -m pytest \
            problems/CPMCM/2025/A/tests/test_q3_evaluator.py \
            problems/CPMCM/2025/A/tests/test_q3_official_optimizer.py \
            -q
      - name: Audit candidate against promoted Q2 and formal Q3
        run: |
          python problems/CPMCM/2025/A/experiments/audit_q3_candidate_promotion.py \
            --data-dir problems/CPMCM/2025/A/data/csv \
            --candidate /tmp/candidate/q3-conv1-iterative-batch-solution.json \
            --official-rounds 2 \
            --out /tmp/q3-conv1-promotion-audit.json
      - name: Upload promotion evidence
        uses: actions/upload-artifact@v4
        with:
          name: cpmcm-2025-a-q3-conv1-promotion-audit
          path: /tmp/q3-conv1-promotion-audit.json
          if-no-files-found: error
