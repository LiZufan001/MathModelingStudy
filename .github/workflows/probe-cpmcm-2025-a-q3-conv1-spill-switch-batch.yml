name: Probe CPMCM 2025 A Q3 Conv1 Spill Switch Batch

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/q3-pipeline-20260911"
    paths:
      - "problems/CPMCM/2025/A/experiments/benchmark_q3_spill_switch_batch_snapshot.py"
      - ".github/workflows/probe-cpmcm-2025-a-q3-conv1-spill-switch-batch.yml"

permissions:
  contents: read
  actions: read

jobs:
  spill-switch-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sparse checkout 2025 A only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2025/A
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download strict three-switch solution artifact
        uses: actions/download-artifact@v4
        with:
          name: cpmcm-2025-a-q3-conv1-fourth-switch
          path: /tmp/three-switch-source
          github-token: ${{ github.token }}
          repository: LiZufan001/MathModelingStudy
          run-id: 34683646610
      - name: Batched switch gates
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest \
            problems/CPMCM/2025/A/experiments/test_q3_critical_spill_switch.py \
            problems/CPMCM/2025/A/experiments/test_q3_critical_spill_switch_batch.py \
            -q
          python -m py_compile problems/CPMCM/2025/A/experiments/benchmark_q3_spill_switch_batch_snapshot.py
      - name: Replay fourth switch then probe OUT batches
        run: |
          python problems/CPMCM/2025/A/experiments/benchmark_q3_spill_switch_batch_snapshot.py \
            --data-dir problems/CPMCM/2025/A/data/csv \
            --solution /tmp/three-switch-source/q3-conv1-three-switch-solution.json \
            --recipe problems/CPMCM/2025/A/experiments/snapshots/q3_conv1_fourth_switch_recipe.json \
            --solution-out /tmp/q3-conv1-batch-switch-solution.json \
            --out /tmp/q3-conv1-batch-switch.json
      - name: Upload batch evidence
        uses: actions/upload-artifact@v4
        with:
          name: cpmcm-2025-a-q3-conv1-spill-switch-batch
          path: |
            /tmp/q3-conv1-batch-switch-solution.json
            /tmp/q3-conv1-batch-switch.json
          if-no-files-found: error
