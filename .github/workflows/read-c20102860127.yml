name: Read C20102860127 for study
on:
  push:
    paths:
      - '.github/workflows/read-c20102860127.yml'
permissions:
  contents: read
jobs:
  read-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            papers/CPMCM/2020/fulltext/C/C20102860127.pdf
            problems/CPMCM/2020/C/2020年C题--面向康复工程的脑电信号分析和判别模型.docx
            problems/CPMCM/2020/C/2020年中国研究生数学建模竞赛C题补充说明.md
            problems/CPMCM/2020/C/附件2-睡眠脑电数据.xlsx
            .github/workflows/read-c20102860127.yml
      - name: Install readers
        run: python -m pip install --quiet pypdf pymupdf python-docx pandas openpyxl
      - name: Extract paper, problem and data summary
        shell: bash
        run: |
          mkdir -p /tmp/c20102860127/pages
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          from docx import Document
          import pymupdf, pandas as pd, json, zipfile, re

          p=Path('papers/CPMCM/2020/fulltext/C/C20102860127.pdf')
          d=Path('problems/CPMCM/2020/C/2020年C题--面向康复工程的脑电信号分析和判别模型.docx')
          x=Path('problems/CPMCM/2020/C/附件2-睡眠脑电数据.xlsx')
          out=Path('/tmp/c20102860127')

          r=PdfReader(str(p))
          print(f'PDF_META pages={len(r.pages)} encrypted={r.is_encrypted} bytes={p.stat().st_size}')
          py=[]
          for i,page in enumerate(r.pages,1):
              py.append(f'===== PAGE {i} / {len(r.pages)} =====\n{page.extract_text() or "[NO TEXT]"}')
          (out/'pypdf.txt').write_text('\n\n'.join(py),encoding='utf-8')

          doc=pymupdf.open(str(p))
          fitz=[]
          for i,page in enumerate(doc,1):
              fitz.append(f'===== PAGE {i} / {len(doc)} =====\n{page.get_text("text",sort=True)}')
              pix=page.get_pixmap(matrix=pymupdf.Matrix(1.7,1.7),alpha=False)
              pix.save(out/f'pages/page-{i:02d}.png')
          (out/'pymupdf.txt').write_text('\n\n'.join(fitz),encoding='utf-8')
          print(f'RENDERED_PAGES={len(doc)}')

          dd=Document(str(d))
          problem=[]
          for para in dd.paragraphs:
              if para.text.strip(): problem.append(para.text)
          for ti,table in enumerate(dd.tables,1):
              problem.append(f'\n[TABLE {ti}]')
              for row in table.rows:
                  problem.append(' | '.join(cell.text.replace('\n',' / ') for cell in row.cells))
          (out/'problem.txt').write_text('\n'.join(problem),encoding='utf-8')

          xl=pd.ExcelFile(x)
          rec=[]
          for sh in xl.sheet_names:
              df=pd.read_excel(x,sheet_name=sh)
              rec.append({
                'sheet':sh,'rows':len(df),'cols':len(df.columns),
                'columns':list(map(str,df.columns)),
                'head':df.head(5).to_dict(orient='records'),
                'missing':{str(k):int(v) for k,v in df.isna().sum().items()},
                'dtypes':{str(k):str(v) for k,v in df.dtypes.items()}
              })
          (out/'sleep-data-summary.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2,default=str),encoding='utf-8')

          print('PROBLEM_PREVIEW')
          print('\n'.join(problem)[:16000])
          print('SLEEP_SHEETS')
          for z in rec:
              print(z['sheet'],z['rows'],z['cols'],z['columns'])
          PY
      - name: Upload study extraction
        uses: actions/upload-artifact@v4
        with:
          name: c20102860127-study-extraction
          path: /tmp/c20102860127/
          if-no-files-found: error
          retention-days: 1
