name: Test CPMCM 2025 A Q1

on:
  push:
    branches:
      - main
      - "agent/q1-exact-pressure-20260911"
    paths:
      - "problems/CPMCM/2025/A/src/**"
      - "problems/CPMCM/2025/A/tests/**"
      - "problems/CPMCM/2025/A/README.md"
      - ".github/workflows/test-cpmcm-2025-a.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  q1-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sparse checkout 2025 A only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2025/A
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Unit and oracle tests
        run: python -m pytest problems/CPMCM/2025/A/tests -q
      - name: Run all six Appendix-E cases
        run: |
          python problems/CPMCM/2025/A/src/batch_q1.py \
            --data-dir problems/CPMCM/2025/A/data/csv \
            --out-dir /tmp/q1-baseline-results
      - name: Upload reproducible baseline outputs
        uses: actions/upload-artifact@v4
        with:
          name: cpmcm-2025-a-q1-baseline
          path: /tmp/q1-baseline-results
          if-no-files-found: error
