name: Probe CPMCM 2025 A Q3 Conv1 Core Schedule

on:
  push:
    branches:
      - "agent/q3-pipeline-20260911"
    paths:
      - "problems/CPMCM/2025/A/experiments/benchmark_q3_schedule_core.py"
      - ".github/workflows/probe-cpmcm-2025-a-q3-conv1-core-schedule.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conv1-core-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sparse checkout 2025 A only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2025/A
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile schedule probes
        run: |
          python -m py_compile \
            problems/CPMCM/2025/A/experiments/q3_priority_rescheduler.py \
            problems/CPMCM/2025/A/experiments/q3_critical_pipe_swap.py \
            problems/CPMCM/2025/A/experiments/benchmark_q3_schedule_core.py
      - name: Probe Conv1 core schedule portfolio
        run: |
          python problems/CPMCM/2025/A/experiments/benchmark_q3_schedule_core.py \
            --case Conv_Case1 \
            --data-dir problems/CPMCM/2025/A/data/csv \
            --out /tmp/q3-conv1-core-schedule.json \
            --pipe-candidates 24
      - name: Upload core schedule evidence
        uses: actions/upload-artifact@v4
        with:
          name: cpmcm-2025-a-q3-conv1-core-schedule
          path: /tmp/q3-conv1-core-schedule.json
          if-no-files-found: error
