name: Read E24102910005 for study
on:
  push:
    paths:
      - '.github/workflows/read-e24102910005.yml'
permissions:
  contents: read
jobs:
  read-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            papers/CPMCM/2024/fulltext/E/E24102910005.pdf
            problems/CPMCM/2024/E/高速公路应急车道启用建模.docx
            problems/CPMCM/2024/E/数据说明.docx
            .github/workflows/read-e24102910005.yml
      - name: Install readers
        run: python -m pip install --quiet pypdf pymupdf python-docx
      - name: Extract paper and problem
        shell: bash
        run: |
          mkdir -p /tmp/e24102910005/pages
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          from docx import Document
          import pymupdf, zipfile, re

          p=Path('papers/CPMCM/2024/fulltext/E/E24102910005.pdf')
          q=Path('problems/CPMCM/2024/E/高速公路应急车道启用建模.docx')
          d=Path('problems/CPMCM/2024/E/数据说明.docx')
          out=Path('/tmp/e24102910005')

          def safe_write(path, text):
              path.write_bytes(str(text).encode('utf-8','replace'))

          r=PdfReader(str(p))
          print(f'PDF_META pages={len(r.pages)} encrypted={r.is_encrypted} bytes={p.stat().st_size}')
          texts=[]
          for i,page in enumerate(r.pages,1):
              texts.append(f'===== PAGE {i} / {len(r.pages)} =====\n{page.extract_text() or "[NO TEXT]"}')
          safe_write(out/'pypdf.txt','\n\n'.join(texts))

          doc=pymupdf.open(str(p))
          fitz=[]
          for i,page in enumerate(doc,1):
              fitz.append(f'===== PAGE {i} / {len(doc)} =====\n{page.get_text("text",sort=True)}')
              pix=page.get_pixmap(matrix=pymupdf.Matrix(1.7,1.7),alpha=False)
              pix.save(out/f'pages/page-{i:03d}.png')
          safe_write(out/'pymupdf.txt','\n\n'.join(fitz))
          print('RENDERED_PAGES',len(doc))

          def extract_docx(path, name):
              doc=Document(str(path)); lines=[]
              for para in doc.paragraphs:
                  if para.text.strip(): lines.append(para.text)
              for ti,table in enumerate(doc.tables,1):
                  lines.append(f'\n[TABLE {ti}]')
                  for row in table.rows:
                      lines.append(' | '.join(cell.text.replace('\n',' / ') for cell in row.cells))
              safe_write(out/f'{name}.txt','\n'.join(lines))
              with zipfile.ZipFile(path) as zz:
                  xml=zz.read('word/document.xml').decode('utf-8','ignore')
              xml_text=re.sub(r'<[^>]+>',' ',xml)
              xml_text=re.sub(r'\s+',' ',xml_text)
              safe_write(out/f'{name}-xmltext.txt',xml_text)
              return lines

          problem=extract_docx(q,'problem')
          desc=extract_docx(d,'data-description')
          print('PROBLEM_PREVIEW')
          print('\n'.join(problem)[:24000].encode('utf-8','replace').decode('utf-8'))
          print('DATA_DESCRIPTION')
          print('\n'.join(desc)[:12000].encode('utf-8','replace').decode('utf-8'))
          PY
      - name: Upload study extraction
        uses: actions/upload-artifact@v4
        with:
          name: e24102910005-study-extraction
          path: /tmp/e24102910005/
          if-no-files-found: error
          retention-days: 1
