name: Test CPMCM 2025 A Q3 FA Priority Portfolio

on:
  push:
    branches:
      - "agent/q3-pipeline-20260911"
    paths:
      - "problems/CPMCM/2025/A/experiments/priority_window_scheduler.py"
      - "problems/CPMCM/2025/A/experiments/test_priority_window_scheduler.py"
      - "problems/CPMCM/2025/A/experiments/benchmark_q3_fa_priority.py"
      - ".github/workflows/test-cpmcm-2025-a-q3-fa-priority.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  q3-fa-priority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sparse checkout 2025 A only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2025/A
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Focused scheduler and strict-evaluator tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest \
            problems/CPMCM/2025/A/experiments/test_priority_window_scheduler.py \
            problems/CPMCM/2025/A/tests/test_q3_evaluator.py \
            problems/CPMCM/2025/A/tests/test_q3_official_optimizer.py \
            -q
      - name: Search FlashAttention pipeline-priority portfolio
        run: |
          python problems/CPMCM/2025/A/experiments/benchmark_q3_fa_priority.py \
            --data-dir problems/CPMCM/2025/A/data/csv \
            --out-dir /tmp/q3-fa-priority \
            --rounds 2
          test -s /tmp/q3-fa-priority/fa_priority_candidates.csv
          test -s /tmp/q3-fa-priority/fa_priority_frontier.csv
          test -s /tmp/q3-fa-priority/fa_priority_summary.json
      - name: Upload FA priority evidence
        uses: actions/upload-artifact@v4
        with:
          name: cpmcm-2025-a-q3-fa-priority
          path: /tmp/q3-fa-priority
          if-no-files-found: error
