name: Fetch more verified CUMCM national-first originals

on:
  push:
    paths:
      - '.github/workflows/fetch-more-national-first-originals.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-originals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install helpers
        run: python -m pip install --quiet requests beautifulsoup4 pypdf

      - name: Fetch public full texts conservatively
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          from pathlib import Path
          from urllib.parse import urljoin
          import io, re, requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          UA = {'User-Agent': 'Mozilla/5.0 (compatible; MathModelingStudy/1.0; public-resource-fetch)'}
          session = requests.Session()
          session.headers.update(UA)
          report = []

          def log(msg):
              print(msg)
              report.append(msg)

          def get(url, timeout=35):
              return session.get(url, timeout=timeout, allow_redirects=True)

          def pdf_text(data: bytes, max_pages=12):
              try:
                  reader = PdfReader(io.BytesIO(data))
                  out=[]
                  for p in reader.pages[:max_pages]:
                      try: out.append(p.extract_text() or '')
                      except Exception: pass
                  return '\n'.join(out), len(reader.pages)
              except Exception:
                  return '', 0

          def normalize(s):
              return re.sub(r'\s+', '', s or '')

          def validate_pdf(data: bytes, required_terms):
              if not data.startswith(b'%PDF-'):
                  return False, 'not PDF signature', '', 0
              if not (100_000 <= len(data) <= 25 * 1024 * 1024):
                  return False, f'unsafe size {len(data)}', '', 0
              text, pages = pdf_text(data)
              nt = normalize(text)
              missing = [x for x in required_terms if normalize(x) not in nt]
              if missing:
                  return False, 'missing terms: ' + ', '.join(missing), text, pages
              return True, f'validated {pages} pages, {len(data)} bytes', text, pages

          def public_pdf_candidates_from_page(page_url):
              urls=[]
              try:
                  r=get(page_url)
                  log(f'GET page {page_url} -> {r.status_code}, {len(r.content)} bytes, final={r.url}')
                  if r.status_code != 200:
                      return urls
                  soup=BeautifulSoup(r.text, 'html.parser')
                  for a in soup.find_all('a', href=True):
                      h=urljoin(r.url, a['href'])
                      low=h.lower()
                      if ('/suite/portal/blob' in low or '.pdf' in low) and h not in urls:
                          urls.append(h)
              except Exception as e:
                  log(f'page fetch failed: {page_url}: {type(e).__name__}: {e}')
              return urls

          # ---- 2022 D: exact public teaching-resource copy of the verified top-3/national-first paper ----
          target = Path('problems/CUMCM/2022/papers/national_first/2022-D-南京工业职业技术大学-共享气象报文的信息传输模型-国一.pdf')
          page='https://exp.lnc.edu.cn/suite/solver/classView.do?action=browse&blockKey=253002&feature=blockItem&key=43613539&siteKey=252613'
          candidates=public_pdf_candidates_from_page(page)
          # The public site uses resource keys close to the content-page key. Probe only the small adjacent public range;
          # every candidate must independently pass exact-title text validation before it can be saved.
          for k in range(43613540, 43613548):
              u=f'https://exp.lnc.edu.cn/suite/portal/blob?download=true&filename={k}.pdf&isResource=true&key={k}'
              if u not in candidates:
                  candidates.append(u)

          imported_d=False
          for u in candidates:
              try:
                  r=get(u, timeout=40)
                  log(f'2022D candidate {u} -> {r.status_code}, {len(r.content)} bytes, type={r.headers.get("content-type")}, final={r.url}')
                  if r.status_code != 200:
                      continue
                  ok, why, text, pages = validate_pdf(r.content, ['共享气象报文', '信息传输模型'])
                  log(f'  validation: {why}')
                  if ok:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(r.content)
                      Path(str(target)+'.source-url.txt').write_text(u+'\n', encoding='utf-8')
                      imported_d=True
                      log(f'IMPORTED 2022D -> {target}')
                      break
              except Exception as e:
                  log(f'2022D candidate failed {u}: {type(e).__name__}: {e}')
          if not imported_d:
              log('NOT IMPORTED 2022D: no unauthenticated public PDF passed exact-title validation.')

          # ---- Other already-verified teams: only detect truly public PDF links; never bypass CNKI/login ----
          checks = [
              ('2023B 南京邮电大学',
               'https://dxs.moe.gov.cn/zx/a/hd_sxjm_smtd/240109/1874022.shtml',
               ['基于区域划分', '多波束']),
              ('2023C 复旦大学',
               'https://qxyy.cbpt.cnki.net/portal/journal/portal/client/paper/cda6fa53133ebdb29d35d057f2dba141',
               ['基于历史数据', '蔬菜类商品']),
              ('2024B 华南理工大学',
               'https://qxyy.cbpt.cnki.net/portal/journal/portal/client/paper/f56032f74d3b78f88c4d6684eb0ea91e',
               ['遗传算法', '蒙特卡洛', '生产决策']),
          ]
          for label, page_url, terms in checks:
              urls=public_pdf_candidates_from_page(page_url)
              accepted=[]
              for u in urls:
                  # Explicitly refuse known gated/login download families. We only test ordinary public links.
                  low=u.lower()
                  if 'login' in low or 'passport' in low:
                      continue
                  try:
                      r=get(u, timeout=35)
                      if r.status_code != 200 or not r.content.startswith(b'%PDF-'):
                          continue
                      ok, why, text, pages=validate_pdf(r.content, terms)
                      if ok:
                          accepted.append((u, len(r.content), pages))
                  except Exception:
                      pass
              if accepted:
                  log(f'{label}: public validated PDF link(s) found but not auto-imported until exact author/team metadata are checked: {accepted}')
              else:
                  log(f'{label}: no unauthenticated public PDF link found on the verified public/journal page; no bypass attempted.')

          # provenance update only if exact 2022D PDF was actually validated/imported
          if imported_d:
              src=Path('problems/CUMCM/2022/papers/national_first/SOURCES.md')
              old=src.read_text(encoding='utf-8') if src.exists() else '# 2022 国一论文来源\n'
              if '## D题 · 南京工业职业技术大学' not in old:
                  old += '''\n\n## D题 · 南京工业职业技术大学\n\n- 获奖：2022 高教社杯全国大学生数学建模竞赛全国一等奖。\n- 学校核验：南京工业职业技术大学官方新闻明确说明《共享气象报文的信息传输模型》（D题）获全国一等奖，且为该题全国最好的 3 篇论文之一，并由组委会推荐发表。\n  - https://www.njuit.edu.cn/ca/d7/c5818a51927/page.htm\n- 期刊核验：《数学建模及其应用》2023, 12(02): 81-89。\n  - DOI: 10.19943/j.2095-3070.jmmia.2023.02.08\n  - https://cjournal.hep.com.cn/2095-3070/CN/2023/12/02\n- 公开全文来源：广东岭南职业技术学院数学建模课程“优秀论文”资源 `2022(D034)共享气象报文的信息传输模型`。\n  - https://exp.lnc.edu.cn/suite/solver/classView.do?action=browse&blockKey=253002&feature=blockItem&key=43613539&siteKey=252613\n- 本地论文：`2022-D-南京工业职业技术大学-共享气象报文的信息传输模型-国一.pdf`\n- 入库校验：下载文件必须为 PDF、100KB–25MiB，并且从正文抽取文本中同时匹配“共享气象报文”和“信息传输模型”；不满足则拒绝入库。\n'''
                  src.write_text(old, encoding='utf-8')

          Path('problems/CUMCM/ORIGINAL_FETCH_REPORT.md').write_text(
              '# 国一论文公开原文抓取报告\n\n'
              '> 本文件由一次性公开资源抓取任务生成。原则：只使用无需登录的公开链接；不绕过 CNKI/期刊登录或付费墙；PDF 必须通过标题关键词与文件格式校验后才能进入 `national_first/`。\n\n'
              + '\n'.join('- '+x for x in report) + '\n', encoding='utf-8')
          PY

      - name: Commit verified originals and report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add problems/CUMCM/2022/papers/national_first problems/CUMCM/ORIGINAL_FETCH_REPORT.md
          if git diff --cached --quiet; then
            echo 'No verified public original was added and report unchanged.'
          else
            git commit -m 'data: fetch additional verified CUMCM national-first originals'
            git push
          fi
