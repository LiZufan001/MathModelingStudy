name: Probe CPMCM 2025 A Q3 Conv1 Fourth Switch

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/q3-pipeline-20260911"
    paths:
      - "problems/CPMCM/2025/A/experiments/snapshots/q3_conv1_third_switch_recipe.json"
      - "problems/CPMCM/2025/A/experiments/benchmark_q3_fourth_spill_switch_snapshot.py"
      - ".github/workflows/probe-cpmcm-2025-a-q3-conv1-fourth-switch.yml"

permissions:
  contents: read
  actions: read

jobs:
  fourth-switch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sparse checkout 2025 A only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2025/A
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download strict two-switch solution artifact
        uses: actions/download-artifact@v4
        with:
          name: cpmcm-2025-a-q3-conv1-third-switch
          path: /tmp/two-switch-source
          github-token: ${{ github.token }}
          repository: LiZufan001/MathModelingStudy
          run-id: 34683136280
      - name: Synthetic switch gates
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest \
            problems/CPMCM/2025/A/experiments/test_q3_critical_spill_switch.py \
            problems/CPMCM/2025/A/experiments/test_q3_critical_spill_switch_recipe.py \
            -q
          python -m py_compile problems/CPMCM/2025/A/experiments/benchmark_q3_fourth_spill_switch_snapshot.py
      - name: Replay third strict switch then search fourth
        run: |
          python problems/CPMCM/2025/A/experiments/benchmark_q3_fourth_spill_switch_snapshot.py \
            --data-dir problems/CPMCM/2025/A/data/csv \
            --solution /tmp/two-switch-source/q3-conv1-two-switch-solution.json \
            --recipe problems/CPMCM/2025/A/experiments/snapshots/q3_conv1_third_switch_recipe.json \
            --solution-out /tmp/q3-conv1-three-switch-solution.json \
            --out /tmp/q3-conv1-fourth-switch.json \
            --max-switches 8
      - name: Upload three-switch snapshot and fourth-switch evidence
        uses: actions/upload-artifact@v4
        with:
          name: cpmcm-2025-a-q3-conv1-fourth-switch
          path: |
            /tmp/q3-conv1-three-switch-solution.json
            /tmp/q3-conv1-fourth-switch.json
          if-no-files-found: error
