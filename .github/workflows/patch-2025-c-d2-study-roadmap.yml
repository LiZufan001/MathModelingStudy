name: Patch 2025 C and D2 study roadmap
on:
  push:
    paths:
      - '.github/workflows/patch-2025-c-d2-study-roadmap.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch roadmap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('papers/CPMCM/study/README.md')
          s=p.read_text(encoding='utf-8')

          replacements = {
            '| 10 | 2025 C | 中国矿业大学 周缘/牛敏学/王聪 | Frangi、几何特征、Monte Carlo、三维概率重构 | ⏳ 待确认全文 |':
            '| 10 | 2025 C | 中国矿业大学 周缘/牛敏学/王聪 | Frangi、几何特征、Monte Carlo、三维概率重构 | 🟡 证据重构，待封面核验 |',
            '| 12 | 2025 D | 辽宁工程技术大学 关昊岩/谢卓毅/杨骞 | 多源融合、数值预报校正、同题异解 | ⏳ 待确认全文 |':
            '| 12 | 2025 D | 辽宁工程技术大学 关昊岩/谢卓毅/杨骞 | 多源融合、数值预报校正、同题异解 | 🟡 同题候选证据重构；目标队全文未找到 |',
          }
          for old,new in replacements.items():
              if old in s:
                  s=s.replace(old,new,1)
              elif new not in s:
                  raise SystemExit(f'roadmap row not found: {old}')

          marker10='## 10. 2025 C｜eaf6375148b2 候选（证据级深读）'
          if marker10 not in s:
              s += '''\n\n## 10. 2025 C｜eaf6375148b2 候选（证据级深读）\n\n> **身份边界：**91 页候选《基于Frangi滤波的钻孔裂隙识别与三维概率重构》与中国矿业大学数模之星冠军论文题名/方法链高度吻合，但尚未看到 PDF 封面队号，不能绑定 `C25102900037`。\n\n- [`2025-C-eaf6375148b2/README.md`](2025-C-eaf6375148b2/README.md)：像素→几何→JRC→3D→不确定性→补钻证据级深读\n- [`2025-C-eaf6375148b2/MODEL_RECONSTRUCTION.md`](2025-C-eaf6375148b2/MODEL_RECONSTRUCTION.md)：统一 fracture posterior 重构\n- [`2025-C-eaf6375148b2/IMAGE_TO_3D_UNCERTAINTY_AUDIT.md`](2025-C-eaf6375148b2/IMAGE_TO_3D_UNCERTAINTY_AUDIT.md)：采样测度、JRC、球面方向、连通概率、补钻专项审计\n- [`2025-C-eaf6375148b2/REVIEWER_REPORT.md`](2025-C-eaf6375148b2/REVIEWER_REPORT.md)：模拟评审与答辩问题\n- [`2025-C-eaf6375148b2/COMPETITION_PLAYBOOK.md`](2025-C-eaf6375148b2/COMPETITION_PLAYBOOK.md)：图像→三维不确定性题速查\n- [`2025-C-eaf6375148b2/SOURCE_PROVENANCE.md`](2025-C-eaf6375148b2/SOURCE_PROVENANCE.md)：候选身份与来源边界\n'''

          marker12='## 12. 2025 D｜95743f6ef8d6 候选（同题证据级深读）'
          if marker12 not in s:
              s += '''\n\n## 12. 2025 D｜95743f6ef8d6 候选（同题证据级深读）\n\n> **身份边界：**110 页候选《基于多源数据融合的低空湍流监测与航路优化》是 2025 D 同题优秀论文，但与关昊岩/谢卓毅/杨骞队官方题名《多源观测融合与数值预报校正的低空湍流监测及航路规划》不同，当前不能绑定 `D25101470007`。本目录用于同题异解训练。\n\n- [`2025-D-95743f6ef8d6/README.md`](2025-D-95743f6ef8d6/README.md)：多源融合→NWP校正→风险航路证据级深读\n- [`2025-D-95743f6ef8d6/MODEL_RECONSTRUCTION.md`](2025-D-95743f6ef8d6/MODEL_RECONSTRUCTION.md)：probabilistic state → forecast distribution → CVaR/chance route 重构\n- [`2025-D-95743f6ef8d6/MULTISOURCE_NWP_ROUTE_AUDIT.md`](2025-D-95743f6ef8d6/MULTISOURCE_NWP_ROUTE_AUDIT.md)：量纲、验证、分辨率、NWP与A*专项审计\n- [`2025-D-95743f6ef8d6/SAME_PROBLEM_COMPARISON.md`](2025-D-95743f6ef8d6/SAME_PROBLEM_COMPARISON.md)：与 `ac2d33da18fa` 的逐问同题异解\n- [`2025-D-95743f6ef8d6/REVIEWER_REPORT.md`](2025-D-95743f6ef8d6/REVIEWER_REPORT.md)：模拟评审与16个答辩问题\n- [`2025-D-95743f6ef8d6/COMPETITION_PLAYBOOK.md`](2025-D-95743f6ef8d6/COMPETITION_PLAYBOOK.md)：多源融合+NWP校正+风险航路速查\n- [`2025-D-95743f6ef8d6/SOURCE_PROVENANCE.md`](2025-D-95743f6ef8d6/SOURCE_PROVENANCE.md)：目标队与候选身份边界\n'''

          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'LiZufan001'
          git config user.email '128899229+LiZufan001@users.noreply.github.com'
          git add papers/CPMCM/study/README.md
          git diff --cached --quiet && exit 0
          git commit -m 'study: sync provisional 2025 C and D2 roadmap status'
          git push
