name: Read B23104860044 for study
on:
  push:
    paths:
      - '.github/workflows/read-b23104860044.yml'
permissions:
  contents: read
jobs:
  read-paper:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            papers/CPMCM/2023/fulltext/B/B23104860044.pdf
            problems/CPMCM/2023/B/DFT类矩阵的整数分解逼近.docx
            .github/workflows/read-b23104860044.yml
      - name: Install readers
        run: python -m pip install --quiet pypdf pymupdf python-docx lxml
      - name: Extract paper and problem and render pages
        shell: bash
        run: |
          mkdir -p /tmp/b23104860044/pages
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          from docx import Document
          from lxml import etree
          import pymupdf, zipfile

          p=Path('papers/CPMCM/2023/fulltext/B/B23104860044.pdf')
          d=Path('problems/CPMCM/2023/B/DFT类矩阵的整数分解逼近.docx')
          out=Path('/tmp/b23104860044')

          r=PdfReader(str(p))
          print(f'PDF_META pages={len(r.pages)} encrypted={r.is_encrypted} bytes={p.stat().st_size}')
          py=[]
          for i,page in enumerate(r.pages,1):
              py.append(f'===== PAGE {i} / {len(r.pages)} =====\n{page.extract_text() or "[NO TEXT]"}')
          (out/'pypdf.txt').write_text('\n\n'.join(py),encoding='utf-8')

          doc=pymupdf.open(str(p))
          fitz=[]
          for i,page in enumerate(doc,1):
              fitz.append(f'===== PAGE {i} / {len(doc)} =====\n{page.get_text("text",sort=True)}')
              pix=page.get_pixmap(matrix=pymupdf.Matrix(1.7,1.7),alpha=False)
              pix.save(out/f'pages/page-{i:02d}.png')
          (out/'pymupdf.txt').write_text('\n\n'.join(fitz),encoding='utf-8')
          print(f'RENDERED_PAGES={len(doc)}')

          dd=Document(str(d))
          problem=[]
          for para in dd.paragraphs:
              if para.text.strip(): problem.append(para.text)
          for ti,table in enumerate(dd.tables,1):
              problem.append(f'\n[TABLE {ti}]')
              for row in table.rows:
                  problem.append(' | '.join(cell.text.replace('\n',' / ') for cell in row.cells))
          (out/'problem.txt').write_text('\n'.join(problem),encoding='utf-8')

          # Extract all Word/OMML text tokens directly from document.xml so equations are not lost.
          with zipfile.ZipFile(d) as z:
              xml=z.read('word/document.xml')
          root=etree.fromstring(xml)
          ns={'w':'http://schemas.openxmlformats.org/wordprocessingml/2006/main',
              'm':'http://schemas.openxmlformats.org/officeDocument/2006/math'}
          blocks=[]
          for pnode in root.xpath('.//w:body/w:p',namespaces=ns):
              toks=[]
              for node in pnode.iter():
                  if node.tag in {f'{{{ns["w"]}}}t', f'{{{ns["m"]}}}t'} and node.text:
                      toks.append(node.text)
              if toks:
                  blocks.append(''.join(toks))
          (out/'problem_xml_math.txt').write_text('\n'.join(blocks),encoding='utf-8')
          print('PROBLEM_XML_PREVIEW')
          print('\n'.join(blocks)[:18000])
          PY
      - name: Upload study extraction
        uses: actions/upload-artifact@v4
        with:
          name: b23104860044-study-extraction-v2
          path: /tmp/b23104860044/
          if-no-files-found: error
          retention-days: 1
