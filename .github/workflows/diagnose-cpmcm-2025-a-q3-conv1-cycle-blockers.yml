name: Diagnose CPMCM 2025 A Q3 Conv1 Cycle Blockers

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/q3-pipeline-20260911"
    paths:
      - ".github/workflows/diagnose-cpmcm-2025-a-q3-conv1-cycle-blockers.yml"

permissions:
  actions: read
  contents: read

jobs:
  conv1-cycle-blockers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sparse checkout 2025 A only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2025/A
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download accepted Conv1 Problem3 output
        uses: actions/download-artifact@v4
        with:
          name: cpmcm-2025-a-q3-conv1-formal-acceptance
          path: /tmp/source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34747404506
      - name: Cycle diagnostic gates
        run: |
          python -m py_compile problems/CPMCM/2025/A/experiments/diagnose_q3_spill_cycle_blockers.py
      - name: Diagnose blocked prefixes
        run: |
          python problems/CPMCM/2025/A/experiments/diagnose_q3_spill_cycle_blockers.py \
            --data-dir problems/CPMCM/2025/A/data/csv \
            --case Conv_Case1 \
            --input-dir /tmp/source/Conv_Case1 \
            --out /tmp/q3-conv1-cycle-blockers.json \
            --max-switches 16 \
            --prefix-sizes 1,2,4,8,11
      - name: Upload cycle witness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpmcm-2025-a-q3-conv1-cycle-blockers
          path: /tmp/q3-conv1-cycle-blockers.json
          if-no-files-found: warn
