name: Patch master after original narrative study
on:
  push:
    paths:
      - '.github/workflows/patch-master-after-original-narrative.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch handbook and index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('papers/CPMCM/study/COMPETITION_MASTER_PLAYBOOK.md')
          s = p.read_text(encoding='utf-8')
          old = '然后每人独立写一句：\n\n> **“我认为这道题最关键的不是 ______，而是 ______。”**\n\n三个人比较这句话，比先讨论“用 XGBoost 还是 LSTM”更有价值。'
          new = '然后每人独立回答三个问题：\n\n1. **我们从题意、数据或机理中观察到了什么关键事实？**\n2. **这些事实限制或排除了哪些建模选择？**\n3. **目前最值得用实验/推导检验的研究判断是什么？**\n\n三个人比较各自的“事实 → 判断”链，比先讨论“用 XGBoost 还是 LSTM”更有价值。不要为了制造洞察而强行写成“不是 A，而是 B”。'
          if old in s:
              s = s.replace(old, new, 1)
          anchor = '- **Boundary**：结论适用到哪里，哪些只是近似/情景/评分。'
          addition = anchor + '\n\n> **证据层说明：**OJME-B 是我们用于检查研究链完整性的二次分析框架，不是对一等奖论文原文句式或章节模板的描述。关于作者实际怎样写、怎样过渡、怎样解释结果，见 [`ORIGINAL_PAPER_NARRATIVE_STUDY.md`](ORIGINAL_PAPER_NARRATIVE_STUDY.md)。任何“作者怎样叙事”的结论必须回到原 PDF 核验。'
          if anchor in s and 'OJME-B 是我们用于检查研究链完整性的二次分析框架' not in s:
              s = s.replace(anchor, addition, 1)
          old2 = '## 7.1 最小叙事单元\n\n一段话尽量形成：'
          new2 = '## 7.1 最小叙事单元\n\n这里的结构是**我们的检查框架，不是国一论文固定句式**。真实优秀论文通常用“由于 / 因此 / 根据 / 在前问基础上 / 观察结果发现”等朴素连接，让事实自然推出方法。原文研究见 [`ORIGINAL_PAPER_NARRATIVE_STUDY.md`](ORIGINAL_PAPER_NARRATIVE_STUDY.md)。\n\n一段话尽量形成：'
          if old2 in s:
              s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          idx = Path('papers/CPMCM/study/README.md')
          t = idx.read_text(encoding='utf-8')
          old_entry = '- [`FINAL_AUDIT_CHECKLIST.md`](FINAL_AUDIT_CHECKLIST.md)：**赛末审计表**。冻结模型后逐项打勾，优先排除 evaluator、硬约束、泄漏、单位、结果版本等一票否决错误。'
          entries = old_entry + '\n- [`NARRATIVE_AND_ARGUMENTATION_GUIDE.md`](NARRATIVE_AND_ARGUMENTATION_GUIDE.md)：**科学论证指南**。严格区分 ORIGINAL / INTERPRETATION / RECOMMENDED，学习方法如何由事实与证据引出。\n- [`ORIGINAL_PAPER_NARRATIVE_STUDY.md`](ORIGINAL_PAPER_NARRATIVE_STUDY.md)：**国一原文叙事研究**。直接回到 exact-match PDF，研究摘要、问题分析、问间过渡、失败实验与结果分析的真实写法。'
          if old_entry in t and 'ORIGINAL_PAPER_NARRATIVE_STUDY.md' not in t:
              t = t.replace(old_entry, entries, 1)
          t = t.replace('核心纪律：**先证明结果是真的，再证明方法很强。**', '核心纪律：**事实先于判断，判断先于方法；结果服务于检验，结论服从于证据。**')
          idx.write_text(t, encoding='utf-8')
          PY
          git config user.name 'LiZufan001'
          git config user.email '128899229+LiZufan001@users.noreply.github.com'
          git add papers/CPMCM/study/COMPETITION_MASTER_PLAYBOOK.md papers/CPMCM/study/README.md
          git diff --cached --quiet && exit 0
          git commit -m 'study: align master playbook with original-paper narrative evidence'
          git push
