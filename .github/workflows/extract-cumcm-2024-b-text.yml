name: Extract CUMCM 2024 B sources to text

on:
  push:
    paths:
      - '.github/workflows/extract-cumcm-2024-b-text.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install poppler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
      - name: Extract PDF sources
        run: |
          set -euo pipefail
          mkdir -p problems/CUMCM/2024/analysis/source_text
          pdftotext -layout 'problems/CUMCM/2024/official/CUMCM2024Problems/B题/B题.pdf' 'problems/CUMCM/2024/analysis/source_text/problem_B_official.txt'
          pdftotext -layout 'problems/CUMCM/2024/papers/national_first/2024-B-华南理工大学-生产决策优化-国一-赛后发表版.pdf' 'problems/CUMCM/2024/analysis/source_text/paper_SCUT_national_first_B_published.txt'
      - name: Commit extracted sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add problems/CUMCM/2024/analysis/source_text/problem_B_official.txt \
                  problems/CUMCM/2024/analysis/source_text/paper_SCUT_national_first_B_published.txt
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'data: extract CUMCM 2024 B sources to text'
            git push
          fi
