name: Import CPMCM 2025 second-prize IDs

on:
  push:
    paths:
      - '.github/workflows/import-cpmcm-2025-second-prize-ids.yml'

permissions:
  contents: write

jobs:
  import-second-prize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            papers/CPMCM/_research/official_awards
            .github/workflows/import-cpmcm-2025-second-prize-ids.yml

      - name: Install extractor and parser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unar
          python -m pip install --quiet pandas openpyxl xlrd

      - name: Download and extract official 2025 award list
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cpmcm-awards/2025
          curl -k -L --fail --retry 3 \
            -A 'Mozilla/5.0' \
            -e 'https://cpipc.acge.org.cn/' \
            'https://cpipc.acge.org.cn/sysFile/downFile.do?fileId=c12ddcb197e547e5be6bd47696b2f1f1' \
            -o /tmp/cpmcm-awards/2025.rar
          file /tmp/cpmcm-awards/2025.rar | grep -qi 'RAR archive'
          sha256sum /tmp/cpmcm-awards/2025.rar
          unar -q -o /tmp/cpmcm-awards/2025 /tmp/cpmcm-awards/2025.rar
          find /tmp/cpmcm-awards/2025 -maxdepth 4 -type f -printf '%p\n' | sort

      - name: Parse national second-prize teams
        shell: bash
        run: |
          cat > /tmp/parse_second.py <<'PY'
          from pathlib import Path
          import csv, json, re
          import pandas as pd

          ROOT = Path('/tmp/cpmcm-awards/2025')
          OUT = Path('papers/CPMCM/_research/official_awards')
          OUT.mkdir(parents=True, exist_ok=True)
          FULL = re.compile(r'(?<![A-Z0-9])([A-F]\s*\d{8,16})(?!\d)', re.I)
          NUM = re.compile(r'(?<!\d)(\d{9,16})(?!\d)')
          ARCHIVE_SHA256 = 'f2964391bb052e7e91b70635ed64853c77e7a492e586bed9ef5f65c2e37168dc'

          def cv(v):
              if pd.isna(v): return ''
              if isinstance(v, float) and v.is_integer(): return str(int(v))
              return str(v).strip()

          def problem(name):
              s = Path(name).stem.upper().replace(' ', '')
              for p in 'ABCDEF':
                  if s.startswith(p) or f'{p}题' in s:
                      return p
              return ''

          records = []
          diagnostics = []
          books = sorted(
              p for p in ROOT.rglob('*')
              if p.suffix.lower() in ('.xls', '.xlsx') and problem(p.name)
          )
          for book in books:
              prob = problem(book.name)
              try:
                  xf = pd.ExcelFile(book)
              except Exception as e:
                  diagnostics.append({'file': str(book), 'error': repr(e)})
                  continue
              for sh in xf.sheet_names:
                  try:
                      df = pd.read_excel(book, sheet_name=sh, header=None, dtype=object)
                  except Exception as e:
                      diagnostics.append({'file': str(book), 'sheet': sh, 'error': repr(e)})
                      continue
                  for i, row in df.iterrows():
                      vals = [cv(x) for x in row.tolist()]
                      joined = ' | '.join(x for x in vals if x)
                      if '二等奖' not in joined:
                          continue
                      codes = []
                      for v in vals:
                          c = v.replace(' ', '').upper()
                          codes += [x.replace(' ', '').upper() for x in FULL.findall(c)]
                          codes += [prob + n for n in NUM.findall(c)]
                      codes = sorted(set(codes))
                      if not codes:
                          diagnostics.append({'problem': prob, 'file': book.name, 'sheet': sh, 'row': int(i), 'unparsed': joined})
                          continue
                      for code in codes:
                          records.append({
                              'year': 2025,
                              'problem': code[0],
                              'code': code,
                              'award': '全国二等奖',
                              'source_file': book.name,
                              'sheet': sh,
                              'row_index': int(i),
                              'evidence': joined,
                          })

          uniq = {(r['problem'], r['code']): r for r in records}
          records = sorted(uniq.values(), key=lambda r: (r['problem'], r['code']))
          out_csv = OUT / 'SECOND_PRIZE_2025.csv'
          with out_csv.open('w', encoding='utf-8-sig', newline='') as f:
              fields = ['year','problem','code','award','source_file','sheet','row_index','evidence']
              w = csv.DictWriter(f, fieldnames=fields)
              w.writeheader(); w.writerows(records)

          by_problem = {p: sum(1 for r in records if r['problem'] == p) for p in 'ABCDEF'}
          diag = {
              'source': 'CPIPC official 2025 final award attachment',
              'source_url': 'https://cpipc.acge.org.cn/sysFile/downFile.do?fileId=c12ddcb197e547e5be6bd47696b2f1f1',
              'archive_sha256': ARCHIVE_SHA256,
              'xlsx_files_parsed': len(books),
              'unique_second_prize_codes': len(records),
              'by_problem': by_problem,
              'parse_warnings': diagnostics,
              'note': 'The final attachment yields 3091 A-F second-prize rows; this differs by 6 from the earlier announcement figure 3085, so the final XLSX attachment is retained as the authoritative row-level baseline.'
          }
          (OUT / 'SECOND_PRIZE_2025_DIAGNOSTICS.json').write_text(json.dumps(diag, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(diag, ensure_ascii=False, indent=2))
          PY
          python /tmp/parse_second.py

      - name: Sanity-check final-list counts
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from collections import Counter
          p = 'papers/CPMCM/_research/official_awards/SECOND_PRIZE_2025.csv'
          rows = list(csv.DictReader(open(p, encoding='utf-8-sig')))
          got = Counter(r['problem'] for r in rows)
          expected = {'A':77, 'B':136, 'C':392, 'D':310, 'E':1953, 'F':223}
          print('total', len(rows), 'by_problem', got)
          assert len(rows) == 3091, len(rows)
          assert dict(got) == expected, (got, expected)
          PY

      - name: Commit second-prize baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/CPMCM/_research/official_awards/SECOND_PRIZE_2025.csv \
                  papers/CPMCM/_research/official_awards/SECOND_PRIZE_2025_DIAGNOSTICS.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: import CPMCM 2025 second-prize IDs [skip ci]'
            git push origin HEAD:main
          fi
