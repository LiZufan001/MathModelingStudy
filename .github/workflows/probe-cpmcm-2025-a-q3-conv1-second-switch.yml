name: Probe CPMCM 2025 A Q3 Conv1 Second Switch

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/q3-pipeline-20260911"
    paths:
      - "problems/CPMCM/2025/A/experiments/benchmark_q3_second_spill_switch_snapshot.py"
      - ".github/workflows/probe-cpmcm-2025-a-q3-conv1-second-switch.yml"

permissions:
  contents: read

jobs:
  second-switch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sparse checkout 2025 A only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2025/A
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synthetic switch gates
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest \
            problems/CPMCM/2025/A/experiments/test_q3_critical_spill_switch.py \
            problems/CPMCM/2025/A/experiments/test_q3_critical_spill_switch_recipe.py \
            -q
      - name: Replay first switch then search a second critical switch
        run: |
          python problems/CPMCM/2025/A/experiments/benchmark_q3_second_spill_switch_snapshot.py \
            --data-dir problems/CPMCM/2025/A/data/csv \
            --snapshot problems/CPMCM/2025/A/experiments/snapshots/q3_conv1_saturated_offsets.json \
            --recipe problems/CPMCM/2025/A/experiments/snapshots/q3_conv1_saturated_switch_recipe.json \
            --out /tmp/q3-conv1-second-switch.json \
            --max-switches 8
      - name: Upload second-switch evidence
        uses: actions/upload-artifact@v4
        with:
          name: cpmcm-2025-a-q3-conv1-second-switch
          path: /tmp/q3-conv1-second-switch.json
          if-no-files-found: error
