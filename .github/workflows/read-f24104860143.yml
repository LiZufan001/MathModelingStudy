name: Audit F24104860143 timing
on:
  push:
    paths:
      - '.github/workflows/read-f24104860143.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2024/F/F题.zip
            .github/workflows/read-f24104860143.yml
      - name: Install jplephem
        run: python -m pip install --quiet jplephem numpy scipy
      - name: Audit units and timing
        shell: bash
        run: |
          python - <<'PY'
          import zipfile, pathlib, math, numpy as np
          from jplephem.spk import SPK
          z=pathlib.Path('problems/CPMCM/2024/F/F题.zip')
          out=pathlib.Path('/tmp/f-audit'); out.mkdir(exist_ok=True)
          with zipfile.ZipFile(z) as zz:
              bsp=[n for n in zz.namelist() if n.endswith('de200.bsp')][0]
              bsp_path=out/'de200.bsp'; bsp_path.write_bytes(zz.read(bsp))
          kernel=SPK.open(str(bsp_path))
          c=299792458.0
          p_g=np.array([1274.913415085168,-1848.8519649923514,6507.26265527945])
          v_g=np.array([-6.210795173831417,3.7461273059407443,2.2763308795948665])
          ref_jd=57715.000000295+2400000.5; ref_ra=83.63307631324167; ref_dec=22.014493269173464
          dra=-14.7e-3/3600/365.2425; ddec=2.0e-3/3600/365.2425
          def uvec(jd):
              ra=math.radians(ref_ra+(jd-ref_jd)*dra); dec=math.radians(ref_dec+(jd-ref_jd)*ddec)
              return np.array([math.cos(dec)*math.cos(ra),math.cos(dec)*math.sin(ra),math.sin(dec)])
          def tdb(jd, buggy):
              g=6.24+0.017202*(jd-2451545.0); seconds=0.001657*math.sin(g)
              return jd + (seconds if buggy else seconds/86400.0), seconds
          def pv(jd):
              pe,ve=kernel[3,399].compute_and_differentiate(jd); pm,vm=kernel[0,3].compute_and_differentiate(jd)
              return pm+pe+p_g, vm/86400+ve/86400+v_g
          for mjd in [57062.0,58119.1651507519]:
              jd=mjd+2400000.5
              jb,s=tdb(jd,True); jc,_=tdb(jd,False)
              pb,vb=pv(jb); pc,vc=pv(jc); u=uvec(jd)
              db=-np.dot(pb,u)*1000/c; dc=-np.dot(pc,u)*1000/c
              print('MJD',mjd)
              print('TDB_MINUS_TT_SECONDS',s)
              print('BUGGY_EPHEM_OFFSET_SECONDS',s*86400)
              print('BUGGY_JD',repr(jb),'CORRECTED_JD',repr(jc))
              print('BUGGY_P_KM',pb.tolist())
              print('CORRECTED_P_KM',pc.tolist())
              print('POSITION_DIFFERENCE_KM',float(np.linalg.norm(pb-pc)))
              print('BUGGY_GEO_DELAY_S',float(db),'CORRECTED_GEO_DELAY_S',float(dc),'DIFF_S',float(db-dc))
              if mjd>58000:
                  # paper functions, both barycentric and GCRS SR choice
                  psun=kernel[0,10].compute(jb)
                  ps2=pb-psun
                  dproj=np.dot(ps2,u)*1000; dsun=np.linalg.norm(ps2)*1000
                  sh=-2*1.327e20/c**3*np.log(dproj/dsun+1)
                  red=-1.327e20/(np.linalg.norm(pb)*1000)/c**2
                  sr_g=2*np.dot(p_g*1000,v_g*1000)/c**2
                  sr_b=2*np.dot(pb*1000,vb*1000)/c**2
                  print('BUGGY_SHAPIRO_S',float(sh))
                  print('PAPER_REDSHIFT_NUMERIC',float(red),'DIMENSIONLESS_BY_UNITS')
                  print('SR_GCRS_CODE_S',float(sr_g),'SR_BCRS_COMMENTED_S',float(sr_b))
                  print('EARTH_SSB_BUGGY_KM',(pb-p_g).tolist())
          kernel.close()
          PY
