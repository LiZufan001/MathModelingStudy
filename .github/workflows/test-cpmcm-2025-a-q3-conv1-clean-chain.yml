name: Test CPMCM 2025 A Q3 Conv1 Clean Chain

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/q3-pipeline-20260911"
    paths:
      - "problems/CPMCM/2025/A/experiments/benchmark_q3_conv1_clean_chain.py"
      - "problems/CPMCM/2025/A/experiments/q3_conv_iterative_spill_batch.py"
      - "problems/CPMCM/2025/A/experiments/q3_critical_spill_switch_batch.py"
      - "problems/CPMCM/2025/A/src/q3_official_optimizer.py"
      - "problems/CPMCM/2025/A/src/q3_conv_greedy_recolor.py"
      - ".github/workflows/test-cpmcm-2025-a-q3-conv1-clean-chain.yml"

permissions:
  contents: read

jobs:
  clean-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Sparse checkout 2025 A only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2025/A
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clean-chain gates
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest \
            problems/CPMCM/2025/A/tests/test_q3_evaluator.py \
            problems/CPMCM/2025/A/tests/test_q3_official_optimizer.py \
            problems/CPMCM/2025/A/experiments/test_q3_conv_local_recolor.py \
            problems/CPMCM/2025/A/experiments/test_q3_critical_spill_switch.py \
            problems/CPMCM/2025/A/experiments/test_q3_critical_spill_switch_batch.py \
            problems/CPMCM/2025/A/experiments/test_q3_conv_iterative_spill_batch.py \
            -q
          python -m py_compile problems/CPMCM/2025/A/experiments/benchmark_q3_conv1_clean_chain.py
      - name: Rebuild Conv1 candidate from promoted Q2
        run: |
          python problems/CPMCM/2025/A/experiments/benchmark_q3_conv1_clean_chain.py \
            --data-dir problems/CPMCM/2025/A/data/csv \
            --iterative-max-rounds 12 \
            --out /tmp/q3-conv1-clean-chain.json \
            --solution-out /tmp/q3-conv1-clean-chain-solution.json
      - name: Upload clean-chain evidence
        uses: actions/upload-artifact@v4
        with:
          name: cpmcm-2025-a-q3-conv1-clean-chain
          path: |
            /tmp/q3-conv1-clean-chain.json
            /tmp/q3-conv1-clean-chain-solution.json
          if-no-files-found: error
