name: Test CPMCM 2025 A Q3 Priority Rescheduler

on:
  push:
    branches:
      - "agent/q3-pipeline-20260911"
    paths:
      - "problems/CPMCM/2025/A/experiments/q3_priority_rescheduler.py"
      - "problems/CPMCM/2025/A/experiments/test_q3_priority_rescheduler.py"
      - ".github/workflows/test-cpmcm-2025-a-q3-priority-rescheduler.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  priority-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sparse checkout 2025 A only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2025/A
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Priority scheduler tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest problems/CPMCM/2025/A/experiments/test_q3_priority_rescheduler.py -q
