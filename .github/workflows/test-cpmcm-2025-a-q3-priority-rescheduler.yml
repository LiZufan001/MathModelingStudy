name: Test CPMCM 2025 A Q3 Priority Rescheduler

on:
  push:
    branches:
      - "agent/q3-pipeline-20260911"
    paths:
      - "problems/CPMCM/2025/A/experiments/q3_priority_rescheduler.py"
      - "problems/CPMCM/2025/A/experiments/test_q3_priority_rescheduler.py"
      - "problems/CPMCM/2025/A/experiments/q3_critical_pipe_swap.py"
      - "problems/CPMCM/2025/A/experiments/test_q3_critical_pipe_swap.py"
      - "problems/CPMCM/2025/A/experiments/q3_spill_gap_shift.py"
      - "problems/CPMCM/2025/A/experiments/test_q3_spill_gap_shift.py"
      - "problems/CPMCM/2025/A/experiments/benchmark_q3_priority_snapshot.py"
      - "problems/CPMCM/2025/A/experiments/benchmark_q3_schedule_snapshot.py"
      - "problems/CPMCM/2025/A/experiments/benchmark_q3_schedule_core.py"
      - "problems/CPMCM/2025/A/experiments/benchmark_q3_snapshot_operator.py"
      - ".github/workflows/test-cpmcm-2025-a-q3-priority-rescheduler.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  priority-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sparse checkout 2025 A only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2025/A
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile schedule benchmark runners
        run: |
          python -m py_compile \
            problems/CPMCM/2025/A/experiments/benchmark_q3_priority_snapshot.py \
            problems/CPMCM/2025/A/experiments/benchmark_q3_schedule_snapshot.py \
            problems/CPMCM/2025/A/experiments/benchmark_q3_schedule_core.py \
            problems/CPMCM/2025/A/experiments/benchmark_q3_snapshot_operator.py
      - name: Zero-traffic schedule operator tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest \
            problems/CPMCM/2025/A/experiments/test_q3_priority_rescheduler.py \
            problems/CPMCM/2025/A/experiments/test_q3_critical_pipe_swap.py \
            problems/CPMCM/2025/A/experiments/test_q3_spill_gap_shift.py \
            -q
