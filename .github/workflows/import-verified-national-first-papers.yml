name: Import verified CUMCM national first-prize papers

on:
  push:
    paths:
      - '.github/workflows/import-verified-national-first-papers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-papers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified public papers
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p problems/CUMCM/2022/papers/national_first
          mkdir -p problems/CUMCM/2023/papers/national_first
          mkdir -p problems/CUMCM/2024/papers/national_first
          mkdir -p problems/CUMCM/2025/papers/national_first

          curl -fL --retry 3 --retry-delay 2 \
            'https://raw.githubusercontent.com/zjuyfy/CUMCM/master/AProblem.pdf' \
            -o 'problems/CUMCM/2022/papers/national_first/2022-A-浙江大学-国一.pdf'

          curl -fL --retry 3 --retry-delay 2 \
            'https://raw.githubusercontent.com/linggm3/2023_CUMCM_National-First-Prize/main/%E5%AE%9A%E6%97%A5%E9%95%9C%E5%9C%BA%E4%BC%98%E5%8C%96%E8%AE%BE%E8%AE%A1%E6%A8%A1%E5%9E%8B.pdf' \
            -o 'problems/CUMCM/2023/papers/national_first/2023-A-中山大学-定日镜场优化设计模型-国一.pdf'

          curl -fL --retry 3 --retry-delay 2 \
            'https://raw.githubusercontent.com/cny123222/CUMCM-2024A-Bench-Dragon/main/OurPaper.pdf' \
            -o 'problems/CUMCM/2024/papers/national_first/2024-A-上海交通大学-板凳龙-国一.pdf'

          for f in \
            'problems/CUMCM/2022/papers/national_first/2022-A-浙江大学-国一.pdf' \
            'problems/CUMCM/2023/papers/national_first/2023-A-中山大学-定日镜场优化设计模型-国一.pdf' \
            'problems/CUMCM/2024/papers/national_first/2024-A-上海交通大学-板凳龙-国一.pdf'; do
            test "$(head -c 5 "$f")" = '%PDF-'
            bytes=$(stat -c%s "$f")
            if [ "$bytes" -lt 100000 ]; then
              echo "Downloaded PDF is unexpectedly small: $f ($bytes bytes)" >&2
              exit 1
            fi
            if [ "$bytes" -gt 26214400 ]; then
              echo "PDF exceeds repository safety limit: $f ($bytes bytes)" >&2
              exit 1
            fi
          done

          cat > problems/CUMCM/2022/papers/national_first/SOURCES.md <<'EOF'
          # 2022 国一论文来源

          ## A题 · 浙江大学

          - 队员：赵云鹏、何逸阳、闻人豪昱
          - 获奖：2022 高教社杯全国大学生数学建模竞赛本科组全国一等奖
          - 国一核验：全国大学生数学建模竞赛组委会官方获奖名单
            - https://www.mcm.edu.cn/upload_cn/node/629/uJzoCRK40ebedd130f42ed41e5f144ac29bae490.pdf
          - 论文公开来源：作者 GitHub 仓库 `zjuyfy/CUMCM`
            - https://github.com/zjuyfy/CUMCM
            - 仓库 README 明确说明为“2022年全国大学生数学建模竞赛A题国一论文、代码、数据”。
          - 本地论文：`2022-A-浙江大学-国一.pdf`
          - 原始公开文件名：`AProblem.pdf`

          > 入库原则：获奖身份与公开论文来源分别留证，不因文件名或第三方转述自行推断奖项。
          EOF

          cat > problems/CUMCM/2023/papers/national_first/SOURCES.md <<'EOF'
          # 2023 国一论文来源

          ## A题 · 中山大学

          - 队员：曾子林、凌国明、郑博文
          - 获奖：2023 高教社杯全国大学生数学建模竞赛本科组全国一等奖
          - 国一核验：全国大学生数学建模竞赛组委会官方获奖名单
            - https://www.mcm.edu.cn/upload_cn/node/701/6XE4ZF5Oc3573e0779f6cd8e31d79a6e9f6fd13d.pdf
          - 论文标题：《定日镜场优化设计模型》
          - 论文公开来源：作者 GitHub 仓库 `linggm3/2023_CUMCM_National-First-Prize`
            - https://github.com/linggm3/2023_CUMCM_National-First-Prize
          - 本地论文：`2023-A-中山大学-定日镜场优化设计模型-国一.pdf`

          > 作者仓库还公开了代码、数据和答辩 PPT；本次只导入论文 PDF，避免学习仓库无必要膨胀。
          EOF

          cat > problems/CUMCM/2024/papers/national_first/SOURCES.md <<'EOF'
          # 2024 国一论文来源

          ## A题 · 上海交通大学

          - 队员：陈静怡、陈诺严、游天明
          - 获奖：2024 高教社杯全国大学生数学建模竞赛本科组全国一等奖，并获“北太天元数模之星”
          - 国一/数模之星核验：全国大学生数学建模竞赛组委会官方获奖名单
            - https://www.mcm.edu.cn/upload_cn/node/733/4rFKQqyT96ee1e63dd8d2408e56df8b2ec172125.pdf
          - 学校交叉核验：上海交通大学教务处
            - https://www.jwc.sjtu.edu.cn/info/1027/121731.htm
          - 论文公开来源：作者 GitHub 仓库 `cny123222/CUMCM-2024A-Bench-Dragon`
            - https://github.com/cny123222/CUMCM-2024A-Bench-Dragon
          - 本地论文：`2024-A-上海交通大学-板凳龙-国一.pdf`
          - 原始公开文件名：`OurPaper.pdf`
          EOF

          cat > problems/CUMCM/2025/papers/national_first/SOURCES.md <<'EOF'
          # 2025 国一论文来源

          ## B题 · 南京大学

          - 队员：竺梅缘、丁士杰、陈昱琰
          - 获奖：2025 高教社杯全国大学生数学建模竞赛本科组全国一等奖，并获“MWORKS数模之星”
          - 国一核验：全国大学生数学建模竞赛组委会官方获奖名单
            - https://www.mcm.edu.cn/upload_cn/node/761/QB2FQ76i1393aefba98af47db43d0e56ab7949c9.pdf
          - 学校交叉核验：南京大学
            - https://ndbgs.nju.edu.cn/xydt/20251218/i354572.html
          - 论文标题：《碳化硅外延层厚度的双光束和多光束干涉法测量研究》
          - 正式发表入口：《数学建模及其应用》2026年第1期
            - https://qxyy.cbpt.cnki.net/portal/journal/portal/client/paper/7d5c7a097115e5a5479db916a500821f
          - DOI：10.19943/j.2095-3070.jmmia.2026.01.10
          - 当前状态：**已核验国一身份，但暂未自动导入 PDF。** 当前正式全文入口通过期刊/CNKI 提供，尚未确认有无需登录、稳定、可自动下载的公开 PDF 直链。

          > 不使用其他仅自称“2025 B题国一”的 GitHub PDF 替代这篇论文，除非后续能把作者/队伍与官方名单可靠对应。
          EOF

          echo 'Imported PDFs:'
          find problems/CUMCM/{2022,2023,2024}/papers/national_first -maxdepth 1 -type f -name '*.pdf' -printf '%s %p\n'

      - name: Commit papers and provenance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add problems/CUMCM/2022/papers problems/CUMCM/2023/papers problems/CUMCM/2024/papers problems/CUMCM/2025/papers
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'data: add verified CUMCM national first-prize papers'
            git push
          fi
