name: Probe CPMCM 2025 A Q3 Conv1 Post-Spill Official

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/q3-pipeline-20260911"
    paths:
      - "problems/CPMCM/2025/A/experiments/benchmark_q3_post_spill_official.py"
      - ".github/workflows/probe-cpmcm-2025-a-q3-conv1-post-spill-official.yml"

permissions:
  contents: read
  actions: read

jobs:
  post-spill-official:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Sparse checkout 2025 A only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2025/A
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download saturated spill-batch candidate
        uses: actions/download-artifact@v4
        with:
          name: cpmcm-2025-a-q3-conv1-iterative-batch
          path: /tmp/source
          github-token: ${{ github.token }}
          repository: LiZufan001/MathModelingStudy
          run-id: 34743831756
      - name: Post-spill official gates
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest \
            problems/CPMCM/2025/A/tests/test_q3_evaluator.py \
            problems/CPMCM/2025/A/tests/test_q3_official_optimizer.py \
            problems/CPMCM/2025/A/tests/test_q3_conv_local_recolor.py \
            -q
          python -m py_compile problems/CPMCM/2025/A/experiments/benchmark_q3_post_spill_official.py
      - name: Probe address pipeline and recolor after spill batches
        run: |
          python problems/CPMCM/2025/A/experiments/benchmark_q3_post_spill_official.py \
            --data-dir problems/CPMCM/2025/A/data/csv \
            --solution /tmp/source/q3-conv1-iterative-batch-solution.json \
            --recolor-rounds 6 \
            --out /tmp/q3-conv1-post-spill-official.json \
            --solution-out /tmp/q3-conv1-post-spill-official-solution.json
      - name: Upload post-spill official evidence
        uses: actions/upload-artifact@v4
        with:
          name: cpmcm-2025-a-q3-conv1-post-spill-official
          path: |
            /tmp/q3-conv1-post-spill-official.json
            /tmp/q3-conv1-post-spill-official-solution.json
          if-no-files-found: error
