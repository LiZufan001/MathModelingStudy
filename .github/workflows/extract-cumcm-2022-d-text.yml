name: Extract CUMCM 2022 D PDFs to text

on:
  push:
    paths:
      - '.github/workflows/extract-cumcm-2022-d-text.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pdftotext
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Extract official problem and national-first paper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p problems/CUMCM/2022/analysis/source_text
          pdftotext -layout \
            'problems/CUMCM/2022/official/D题.pdf' \
            'problems/CUMCM/2022/analysis/source_text/problem_D_official.txt'
          pdftotext -layout \
            'problems/CUMCM/2022/papers/national_first/2022-D-南京工业职业技术大学-共享气象报文的信息传输模型-国一.pdf' \
            'problems/CUMCM/2022/analysis/source_text/paper_NJUIT_national_first_D.txt'
          wc -l problems/CUMCM/2022/analysis/source_text/problem_D_official.txt
          wc -l problems/CUMCM/2022/analysis/source_text/paper_NJUIT_national_first_D.txt

      - name: Commit extracted text
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add problems/CUMCM/2022/analysis/source_text/problem_D_official.txt \
                  problems/CUMCM/2022/analysis/source_text/paper_NJUIT_national_first_D.txt
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'tooling: extract 2022 D CUMCM PDFs to text'
            git push
          fi
