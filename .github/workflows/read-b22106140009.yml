name: Read B22106140009 for study
on:
  push:
    paths:
      - '.github/workflows/read-b22106140009.yml'
permissions:
  contents: read
jobs:
  read-paper:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            papers/CPMCM/2022/fulltext/B/B22106140009.pdf
            problems/CPMCM/2022/B/方形件组批优化问题.docx
            problems/CPMCM/2022/B/子问题1-数据集A
            problems/CPMCM/2022/B/子问题2-数据集B
            .github/workflows/read-b22106140009.yml
      - name: Install readers
        run: python -m pip install --quiet pypdf pymupdf python-docx pandas numpy
      - name: Extract paper problem and audit data
        shell: bash
        run: |
          mkdir -p /tmp/b22106140009/pages
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          from docx import Document
          import pymupdf, pandas as pd, numpy as np, json, math
          p=Path('papers/CPMCM/2022/fulltext/B/B22106140009.pdf')
          d=Path('problems/CPMCM/2022/B/方形件组批优化问题.docx')
          out=Path('/tmp/b22106140009')
          PL,PW=2440.0,1220.0; PA=PL*PW
          r=PdfReader(str(p)); py=[]
          for i,page in enumerate(r.pages,1): py.append(f'===== PAGE {i} / {len(r.pages)} =====\n{page.extract_text() or "[NO TEXT]"}')
          (out/'pypdf.txt').write_text('\n\n'.join(py),encoding='utf-8')
          doc=pymupdf.open(str(p)); fitz=[]
          for i,page in enumerate(doc,1):
              fitz.append(f'===== PAGE {i} / {len(doc)} =====\n{page.get_text("text",sort=True)}')
              pix=page.get_pixmap(matrix=pymupdf.Matrix(1.7,1.7),alpha=False); pix.save(out/f'pages/page-{i:02d}.png')
          (out/'pymupdf.txt').write_text('\n\n'.join(fitz),encoding='utf-8')
          dd=Document(str(d)); problem=[]
          for para in dd.paragraphs:
              if para.text.strip(): problem.append(para.text)
          for ti,table in enumerate(dd.tables,1):
              problem.append(f'\n[TABLE {ti}]')
              for row in table.rows: problem.append(' | '.join(cell.text.replace('\n',' / ') for cell in row.cells))
          (out/'problem.txt').write_text('\n'.join(problem),encoding='utf-8')
          paper_A={'dataA1':(89,0.9387),'dataA2':(89,0.9312),'dataA3':(88,0.9515),'dataA4':(87,0.9408)}
          paper_B={'dataB1':(42,3462,0.8603),'dataB2':(12,2270,0.8488),'dataB3':(27,2298,0.8415),'dataB4':(30,2392,0.8487),'dataB5':(45,3733,0.8277)}
          audit=[]
          roots=[Path('problems/CPMCM/2022/B/子问题1-数据集A'),Path('problems/CPMCM/2022/B/子问题2-数据集B')]
          for root in roots:
              for fp in sorted(root.glob('*.csv')):
                  df=pd.read_csv(fp); name=fp.stem
                  qty=pd.to_numeric(df.item_num,errors='coerce').fillna(0)
                  area=pd.to_numeric(df.item_length,errors='coerce')*pd.to_numeric(df.item_width,errors='coerce')*qty
                  total=float(area.sum()); items=int(qty.sum())
                  mat_area=pd.DataFrame({'m':df.item_material,'a':area}).groupby('m').a.sum()
                  material_lb=int(sum(math.ceil(x/PA) for x in mat_area))
                  rec={'dataset':name,'rows':len(df),'total_items':items,'orders':int(df.item_order.nunique()),'materials':int(df.item_material.nunique()),'total_area_mm2':total,'area_LB_plates':int(math.ceil(total/PA)),'material_LB_plates':material_lb,'order_dtype':str(df.item_order.dtype),'order_samples':df.item_order.astype(str).head(5).tolist(),'integer_order_matches':int(df.item_order.isin(range(1,df.item_order.nunique()+1)).sum())}
                  if name in paper_A:
                      n,u=paper_A[name]; rec.update(paper_plates=n,paper_util=u,recomputed_util=total/(n*PA),gap_vs_area_LB=n-rec['area_LB_plates'])
                  if name in paper_B:
                      b,n,u=paper_B[name]
                      og=pd.DataFrame({'order':df.item_order,'items':qty,'area':area}).groupby('order').sum()
                      rec.update(paper_batches=b,paper_plates=n,paper_util=u,recomputed_util=total/(n*PA),gap_vs_area_LB=n-rec['area_LB_plates'],gap_vs_material_LB=n-material_lb,item_count_batch_LB=int(math.ceil(items/1000)),area_batch_LB=int(math.ceil(total/250e6)),mandatory_batch_LB=max(int(math.ceil(items/1000)),int(math.ceil(total/250e6))),max_order_items=int(og['items'].max()),max_order_area_mm2=float(og['area'].max()))
                  audit.append(rec)
          (out/'data-audit.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(audit,ensure_ascii=False,indent=2))
          PY
      - name: Upload study extraction
        uses: actions/upload-artifact@v4
        with:
          name: b22106140009-study-extraction-v3
          path: /tmp/b22106140009/
          if-no-files-found: error
          retention-days: 1
