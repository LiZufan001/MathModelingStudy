name: Read B22106140009 for study
on:
  push:
    paths:
      - '.github/workflows/read-b22106140009.yml'
permissions:
  contents: read
jobs:
  read-paper:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            papers/CPMCM/2022/fulltext/B/B22106140009.pdf
            problems/CPMCM/2022/B/方形件组批优化问题.docx
            problems/CPMCM/2022/B/子问题1-数据集A
            problems/CPMCM/2022/B/子问题2-数据集B
            .github/workflows/read-b22106140009.yml
      - name: Install readers
        run: python -m pip install --quiet pypdf pymupdf python-docx pandas numpy
      - name: Extract paper problem and audit data
        shell: bash
        run: |
          mkdir -p /tmp/b22106140009/pages
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          from docx import Document
          import pymupdf, pandas as pd, numpy as np, json, math

          p=Path('papers/CPMCM/2022/fulltext/B/B22106140009.pdf')
          d=Path('problems/CPMCM/2022/B/方形件组批优化问题.docx')
          out=Path('/tmp/b22106140009')
          PL, PW = 2440.0, 1220.0
          PA = PL*PW

          r=PdfReader(str(p))
          py=[]
          for i,page in enumerate(r.pages,1):
              py.append(f'===== PAGE {i} / {len(r.pages)} =====\n{page.extract_text() or "[NO TEXT]"}')
          (out/'pypdf.txt').write_text('\n\n'.join(py),encoding='utf-8')

          doc=pymupdf.open(str(p))
          fitz=[]
          for i,page in enumerate(doc,1):
              fitz.append(f'===== PAGE {i} / {len(doc)} =====\n{page.get_text("text",sort=True)}')
              pix=page.get_pixmap(matrix=pymupdf.Matrix(1.7,1.7),alpha=False)
              pix.save(out/f'pages/page-{i:02d}.png')
          (out/'pymupdf.txt').write_text('\n\n'.join(fitz),encoding='utf-8')

          dd=Document(str(d))
          problem=[]
          for para in dd.paragraphs:
              if para.text.strip(): problem.append(para.text)
          for ti,table in enumerate(dd.tables,1):
              problem.append(f'\n[TABLE {ti}]')
              for row in table.rows:
                  problem.append(' | '.join(cell.text.replace('\n',' / ') for cell in row.cells))
          (out/'problem.txt').write_text('\n'.join(problem),encoding='utf-8')

          paper_A={'dataA1':(89,0.9387),'dataA2':(89,0.9312),'dataA3':(88,0.9515),'dataA4':(87,0.9408)}
          paper_B={'dataB1':(42,3462,0.8603),'dataB2':(12,2270,0.8488),'dataB3':(27,2298,0.8415),'dataB4':(30,2392,0.8487),'dataB5':(45,3733,0.8277)}
          audit=[]
          roots=[Path('problems/CPMCM/2022/B/子问题1-数据集A'),Path('problems/CPMCM/2022/B/子问题2-数据集B')]
          for root in roots:
              for fp in sorted(root.glob('*.csv')):
                  df=pd.read_csv(fp)
                  name=fp.stem
                  qty=pd.to_numeric(df['item_num'],errors='coerce').fillna(0)
                  area=pd.to_numeric(df['item_length'],errors='coerce')*pd.to_numeric(df['item_width'],errors='coerce')*qty
                  total_area=float(area.sum())
                  total_items=int(qty.sum())
                  orders=df['item_order'].nunique()
                  mats=df['item_material'].nunique()
                  rec={
                    'dataset':name,'rows':len(df),'total_items':total_items,'orders':int(orders),'materials':int(mats),
                    'total_area_mm2':total_area,'area_lower_bound_plates':int(math.ceil(total_area/PA)),
                    'max_length':float(df['item_length'].max()),'max_width':float(df['item_width'].max()),
                    'rotatable_fit_violations':int(((df['item_length']>PL)&(df['item_width']>PL) | (df['item_length']>PW)&(df['item_width']>PW)).sum()),
                  }
                  if name in paper_A:
                      n, util=paper_A[name]
                      rec['paper_plates']=n; rec['paper_util']=util
                      rec['util_recomputed_from_raw']=total_area/(n*PA)
                      rec['gap_over_area_LB_plates']=n-rec['area_lower_bound_plates']
                  if name in paper_B:
                      batches,n,util=paper_B[name]
                      rec['paper_batches']=batches; rec['paper_plates']=n; rec['paper_util']=util
                      rec['util_recomputed_from_raw']=total_area/(n*PA)
                      rec['gap_over_area_LB_plates']=n-rec['area_lower_bound_plates']
                      # batch lower bounds from item-count and area constraints
                      rec['item_count_batch_LB']=int(math.ceil(total_items/1000))
                      rec['area_batch_LB']=int(math.ceil(total_area/(250e6)))
                      # each order feasibility stats
                      og=df.assign(_qty=qty,_area=area).groupby('item_order').agg(items=('_qty','sum'),area=('_area','sum'))
                      rec['max_order_items']=int(og['items'].max())
                      rec['max_order_area_mm2']=float(og['area'].max())
                      rec['orders_exceeding_batch_item_limit']=int((og['items']>1000).sum())
                      rec['orders_exceeding_batch_area_limit']=int((og['area']>250e6).sum())
                  audit.append(rec)
          (out/'data-audit.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(audit,ensure_ascii=False,indent=2))
          PY
      - name: Upload study extraction
        uses: actions/upload-artifact@v4
        with:
          name: b22106140009-study-extraction-v2
          path: /tmp/b22106140009/
          if-no-files-found: error
          retention-days: 1
