name: Probe CPMCM 2025 A Q3 Conv0 Single-Switch Checkpoint

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/q3-pipeline-20260911"
    paths:
      - ".github/workflows/probe-cpmcm-2025-a-q3-conv0-single-switch-checkpoint.yml"

permissions:
  actions: read
  contents: read

jobs:
  conv0-single-switch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sparse checkout 2025 A only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2025/A
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download accepted Conv0 Problem3 output
        uses: actions/download-artifact@v4
        with:
          name: cpmcm-2025-a-q3-formal-output-Conv_Case0
          path: /tmp/source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34747455829
      - name: Single-switch checkpoint gates
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest problems/CPMCM/2025/A/experiments/test_q3_critical_spill_switch.py -q
          python -m py_compile problems/CPMCM/2025/A/experiments/probe_q3_single_switch_checkpoint.py
      - name: Probe one bounded single-switch round
        run: |
          python problems/CPMCM/2025/A/experiments/probe_q3_single_switch_checkpoint.py \
            --data-dir problems/CPMCM/2025/A/data/csv \
            --case Conv_Case0 \
            --input-dir /tmp/source/Problem3 \
            --out-dir /tmp/q3-conv0-single-switch \
            --max-switches 4 \
            --expected-official 597969
      - name: Upload checkpoint evidence
        uses: actions/upload-artifact@v4
        with:
          name: cpmcm-2025-a-q3-conv0-single-switch-checkpoint
          path: /tmp/q3-conv0-single-switch
          if-no-files-found: error
