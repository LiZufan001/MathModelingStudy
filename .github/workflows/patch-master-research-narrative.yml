          new20 = r'''# 20. 最终评价观：评委真正评价的是研究判断力

“让评委信服”不能被理解为修辞目标。真正应该追求的是：

> **让评委沿着你的研究链检查以后，找不到关键步骤需要靠脑补。**

评委最终在判断五件事：

### 1. 问题理解有没有洞察

你是否识别了真正关键的机制、结构、资源矛盾，而不是按表面题型套模型。

### 2. 每个建模选择是否有依据

假设、变量、特征、指标、算法和参数为什么这样设，都能追溯到题意、数据、机理、文献或实验。

### 3. 证据是否真的能支持判断

不是“画出来像”，而是有 baseline、反例、下界、严格切分、独立验证、敏感性或不确定性。

### 4. 研究链是否连续

前一问的输出是否成为后一问的状态、reference、特征、约束或 evaluator；整篇是否在研究同一个问题，而不是展示多套算法。

### 5. 是否知道结论边界

能区分：假设、预测、评分、概率、因果、最优、近似和工程建议。

所以真正的获奖核心不是：

```text
模型高级 + 数字漂亮
```

而是：

\[
\boxed{
\text{研究判断}
\rightarrow
\text{数学化}
\rightarrow
\text{证据}
\rightarrow
\text{解释}
\rightarrow
\text{边界}
}
\]

高级算法只是其中可能用到的工具。

---

'''
