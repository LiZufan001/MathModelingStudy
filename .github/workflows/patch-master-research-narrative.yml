          new15 = r'''# 15. 论文叙事与科学论证：按“研究判断”组织，不按算法名组织

> 完整专项见 [`NARRATIVE_AND_ARGUMENTATION_GUIDE.md`](NARRATIVE_AND_ARGUMENTATION_GUIDE.md)。

## 15.1 叙事不是包装，而是暴露方法选择的因果关系

每一个重要方法尽量形成五步链：

```text
观察 / 困难
   ↓
建模判断
   ↓
方法选择
   ↓
证据
   ↓
边界 / 下一问
```

记作：

\[
O\rightarrow J\rightarrow M\rightarrow E\rightarrow B.
\]

差的写法：

```text
为提高精度，采用 XGBoost。
```

好的写法：

```text
线性基线在高值区持续低估，残差呈明显非线性；
因此使用树提升模型拟合剩余非线性关系；
高值区 MAE 下降，而普通区间变化有限；
说明改进主要针对该失败模式。
```

方法是研究判断的结果，而不是段落主角。

## 15.2 每一问建议写成七段研究链

1. **核心矛盾**：本问真正难在哪里；
2. **数据 / 机理诊断**：什么事实支持我们的理解；
3. **建模判断**：因此把问题抽象成什么；
4. **数学模型**：变量、状态、关系；
5. **求解方法**：怎样算，而不是为什么研究；
6. **验证 / 反例 / 边界**：为什么相信；
7. **本问输出 → 下一问接口**：这一问研究对象如何继续升级。

不要写成：

```text
RF 原理
→ XGBoost 原理
→ LSTM 原理
→ GA 原理
```

## 15.3 四问必须有桥

常见桥接方式：

- **输出桥**：Q1 得到状态，Q2 使用该状态；
- **限制桥**：Q1 在假设 A 下求解，Q2 放宽/取消 A；
- **资源桥**：Q1 高精度但昂贵，Q2 构造低成本代理；
- **决策桥**：Q1/Q2 预测，Q3 研究如何据此行动；
- **不确定性桥**：前问估计误差，后问把它传播到决策。

如果各问之间只能靠“针对问题二”连接，优先重新找统一主线。

## 15.4 公式前后必须各说一件事

公式前：

> **为什么需要这个量？它对应什么现实机制？**

公式后：

> **这个量增大/减小时意味着什么？它怎样进入下一步？**

公式不是装饰，也不是“数学味”的来源；它应当是论证链中的一个节点。

## 15.5 失败实验可以成为高质量叙事证据

只要失败实验满足：

1. 揭示了一个数据/机制事实；
2. 改变了后续模型选择；
3. 有严格验证，而不是简单“没调好”。

就应该保留关键结果。

推荐表述：

> “首先尝试 A，因为……；但在严格验证下 B 场景明显失效，说明假设 C 不成立，因此转向 D，并用 E 验证该调整确实针对原失效模式。”

## 15.6 创新优先写在“研究表示”而不是算法名

优先级：

```text
新的问题表示
> 新状态 / 新变量
> 新结构利用
> 新模型接口
> 新验证设计
> 针对性组合
> 改进某算法
```

“改进遗传算法 / 改进随机森林”通常不是最容易让评委记住的创新。

## 15.7 摘要是压缩研究故事

每问尽量形成：

```text
任务
→ 核心判断
→ 方法
→ 最关键证据
```

摘要整体顺序：

```text
现实问题与关键困难
→ 核心建模洞察
→ 各问沿同一主线如何推进
→ 最重要的结果与验证
→ 决策意义 / 适用边界
```

**30 秒测试：把摘要里的算法名全部删掉。**

如果评委仍然能看懂你认为问题本质是什么、各问怎么连接、做出了什么研究判断，摘要才真正有建模思想。

## 15.8 结果必须从“数字”继续走到“认识”

不要停在：

> “模型 A 的 R² 高于模型 B。”

继续回答：

> “提升集中发生在哪类样本？为什么？它说明原模型漏掉了什么关系？”

结果只有被解释后，才成为研究结论。

## 15.9 结论强度必须和证据强度一致

例如：

- self-consistency → 只能说内部一致；
- baseline comparison → 当前协议下更好；
- external test → 才能谈外部泛化；
- assumed capacity + simulation → 只能说“在该假设下模型预测”；
- normalized score → 没校准前不要叫 probability。

论文的可信度很大程度来自：**知道自己能说到哪里。**

---

'''
