name: Extract CUMCM 2024 PDFs to text

on:
  push:
    paths:
      - '.github/workflows/extract-cumcm-2024-text.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PDF reader
        run: python -m pip install --quiet pypdf

      - name: Extract official problem and national-first paper
        shell: bash
        run: |
          mkdir -p problems/CUMCM/2024/analysis/source_text
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader

          jobs = [
              (Path('problems/CUMCM/2024/official/CUMCM2024Problems/A题/A题.pdf'), Path('problems/CUMCM/2024/analysis/source_text/problem_A_official.txt')),
              (Path('problems/CUMCM/2024/papers/national_first/2024-A-上海交通大学-板凳龙-国一.pdf'), Path('problems/CUMCM/2024/analysis/source_text/paper_SJTU_national_first.txt')),
          ]
          for src, dst in jobs:
              reader = PdfReader(str(src))
              parts = []
              for i, page in enumerate(reader.pages, 1):
                  try:
                      text = page.extract_text() or ''
                  except Exception as exc:
                      text = f'[page extraction failed: {exc}]'
                  parts.append(f'\n===== PAGE {i} =====\n{text}')
              dst.write_text('\n'.join(parts), encoding='utf-8')
              print(src, '->', dst, 'pages=', len(reader.pages))
          PY

      - name: Commit extracted text
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add problems/CUMCM/2024/analysis/source_text
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'data: extract CUMCM 2024 A problem and paper text'
          git push
