name: Probe CPMCM 2025 A Q3 Conv1 Single-Switch Top4

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/q3-pipeline-20260911"
    paths:
      - ".github/workflows/probe-cpmcm-2025-a-q3-conv1-single-switch-top4.yml"

permissions:
  actions: read
  contents: read

jobs:
  conv1-single-switch-top4:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Sparse checkout 2025 A only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2025/A
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download accepted Conv1 Problem3 output
        uses: actions/download-artifact@v4
        with:
          name: cpmcm-2025-a-q3-conv1-formal-acceptance
          path: /tmp/source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34747404506
      - name: Single-switch Conv1 gates
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest problems/CPMCM/2025/A/experiments/test_q3_critical_spill_switch.py -q
          python -m py_compile problems/CPMCM/2025/A/experiments/probe_q3_single_switch_checkpoint.py
      - name: Probe one bounded Conv1 single-switch round
        run: |
          python problems/CPMCM/2025/A/experiments/probe_q3_single_switch_checkpoint.py \
            --data-dir problems/CPMCM/2025/A/data/csv \
            --case Conv_Case1 \
            --input-dir /tmp/source/Problem3 \
            --out-dir /tmp/q3-conv1-single-switch-top4 \
            --max-switches 4 \
            --expected-official 3767326
      - name: Upload Conv1 top4 checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpmcm-2025-a-q3-conv1-single-switch-top4
          path: /tmp/q3-conv1-single-switch-top4
          if-no-files-found: warn
