name: Test CPMCM 2025 A Q3 FA1 Deep Recolor

on:
  push:
    branches:
      - "agent/q3-pipeline-20260911"
    paths:
      - ".github/workflows/test-cpmcm-2025-a-q3-fa1-deep.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  q3-fa1-deep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Sparse checkout 2025 A only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2025/A
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deep greedy recolor probe
        run: |
          OUT_DIR=/tmp/q3-fa1-deep
          python problems/CPMCM/2025/A/experiments/benchmark_q3_recolor_generalization_case.py \
            --case FlashAttention_Case1 \
            --data-dir problems/CPMCM/2025/A/data/csv \
            --out-dir "$OUT_DIR" \
            --max-rounds 24 \
            --max-targets 6 \
            --max-starts 12
          test -s "$OUT_DIR/conv_local_recolor_summary.csv"
          test -s "$OUT_DIR/conv_local_recolor_trials.csv"
          test -s "$OUT_DIR/conv_local_recolor_summary.json"
      - name: Upload FA1 deep evidence
        uses: actions/upload-artifact@v4
        with:
          name: cpmcm-2025-a-q3-fa1-deep-recolor
          path: /tmp/q3-fa1-deep
          if-no-files-found: error
