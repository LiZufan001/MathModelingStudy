name: Read F20102840100 for study
on:
  push:
    paths:
      - '.github/workflows/read-f20102840100.yml'
permissions:
  contents: read
jobs:
  read-paper:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            papers/CPMCM/2020/fulltext/F/F20102840100.pdf
            problems/CPMCM/2020/F/2020年F题--飞行器质心平衡供油策略优化.zip
            .github/workflows/read-f20102840100.yml
      - name: Install readers
        run: python -m pip install --quiet pypdf pymupdf openpyxl
      - name: Extract paper and original problem package
        shell: bash
        run: |
          mkdir -p /tmp/f20102840100/pages /tmp/f20102840100/problem
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          import pymupdf, zipfile, json, shutil

          p = Path('papers/CPMCM/2020/fulltext/F/F20102840100.pdf')
          z = Path('problems/CPMCM/2020/F/2020年F题--飞行器质心平衡供油策略优化.zip')
          out = Path('/tmp/f20102840100')

          r = PdfReader(str(p))
          print(f'PDF_META pages={len(r.pages)} encrypted={r.is_encrypted} bytes={p.stat().st_size}')
          pypdf_text = []
          for i, page in enumerate(r.pages, 1):
              pypdf_text.append(f'===== PAGE {i} / {len(r.pages)} =====\n{page.extract_text() or "[NO TEXT]"}')
          (out/'pypdf.txt').write_text('\n\n'.join(pypdf_text), encoding='utf-8')

          doc = pymupdf.open(str(p))
          fitz_text = []
          for i, page in enumerate(doc, 1):
              fitz_text.append(f'===== PAGE {i} / {len(doc)} =====\n{page.get_text("text", sort=True)}')
              pix = page.get_pixmap(matrix=pymupdf.Matrix(1.7,1.7), alpha=False)
              pix.save(out/f'pages/page-{i:02d}.png')
          (out/'pymupdf.txt').write_text('\n\n'.join(fitz_text), encoding='utf-8')

          with zipfile.ZipFile(z) as zz:
              names=zz.namelist()
              (out/'problem-files.json').write_text(json.dumps(names,ensure_ascii=False,indent=2),encoding='utf-8')
              zz.extractall(out/'problem')
          print('PROBLEM_FILES')
          print('\n'.join(names))
          PY
          find /tmp/f20102840100/problem -type f -maxdepth 4 -print
      - name: Upload study extraction
        uses: actions/upload-artifact@v4
        with:
          name: f20102840100-study-extraction-v2
          path: /tmp/f20102840100/
          if-no-files-found: error
          retention-days: 1
