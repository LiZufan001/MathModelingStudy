name: Test CPMCM 2025 A Q3 Official Objective

on:
  push:
    branches:
      - "agent/q3-pipeline-20260911"
    paths:
      - ".github/workflows/test-cpmcm-2025-a-q3-official.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  q3-official:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Sparse checkout 2025 A only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2025/A
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Focused official-objective regression tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest \
            problems/CPMCM/2025/A/tests/test_q3_evaluator.py \
            problems/CPMCM/2025/A/tests/test_q3_reallocator.py \
            problems/CPMCM/2025/A/tests/test_q3_pipeline_scheduler.py \
            problems/CPMCM/2025/A/tests/test_q3_official_optimizer.py \
            -q
      - name: Benchmark official-objective zero-traffic Q3 optimizer
        run: |
          python problems/CPMCM/2025/A/src/benchmark_q3_official_zero_traffic.py \
            --data-dir problems/CPMCM/2025/A/data/csv \
            --out-dir /tmp/q3-official-zero-traffic \
            --rounds 2
          test -s /tmp/q3-official-zero-traffic/q3_official_zero_traffic_summary.csv
      - name: Upload official-objective Q3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: cpmcm-2025-a-q3-official-zero-traffic
          path: /tmp/q3-official-zero-traffic
          if-no-files-found: error
