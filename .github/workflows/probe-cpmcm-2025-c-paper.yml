name: Probe CPMCM 2025 C paper
on:
  push:
    paths:
      - '.github/workflows/probe-cpmcm-2025-c-paper.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch study roadmap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('papers/CPMCM/study/README.md')
          s=p.read_text(encoding='utf-8')
          old='| 10 | 2025 C | 中国矿业大学 周缘/牛敏学/王聪 | Frangi、几何特征、Monte Carlo、三维概率重构 | ⏳ 待确认全文 |'
          new='| 10 | 2025 C | 中国矿业大学 周缘/牛敏学/王聪；候选 `eaf6375148b2` | Frangi、几何特征、Monte Carlo、三维概率重构 | 🟡 91页候选证据重构；待封面/PDF全文视觉核验 |'
          if old not in s:
              raise SystemExit('target roadmap row not found')
          s=s.replace(old,new,1)
          marker='> **2024 E 来源说明：**原路线点名广西大学王家宝、石磊、施涵团队（`E24105930017`）。校方官方报道可核验其全国一等奖身份，并公开 YOLOv10+FairMOT、AHP、K-means、改进机器学习、模糊逻辑的总体方法链，但当前公开全文包未收录与该队精确对应的 PDF。本轮实际逐页精读 `E24102910005`（南京工业大学任碧芸、张朝凯、武瑞，全国一等奖、数模之星提名），同时另建广西大学官方方法对照；若日后获得广西大学全文，再新增独立目录。'
          note='''\n\n> **2025 C 来源说明：**矿大冠军队 `C25102900037` 与官方题名已核验；公开优秀论文候选 `基于 Frangi 滤波的钻孔裂隙识别与三维概率重构` 为 91 页、SHA256 `eaf6375148b2...`，题名和方法链与冠军高度吻合，但尚未看到 PDF 封面队号。外部公开仓库保留该 91 页候选的全文人工深读/页码证据，但没有提交 PDF 本体；公共网盘与其 Git 历史均未恢复二进制。因此当前只建立 [`2025-C-eaf6375148b2/`](2025-C-eaf6375148b2/) 证据重构资料，不把 9/13 的正式逐页精读计数增加。得到 PDF 后必须先核封面，再做 91 页视觉扫描与公式/结果复核。'''
          if note.strip() not in s:
              if marker not in s:
                  raise SystemExit('source-note insertion marker not found')
              s=s.replace(marker,marker+note,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/CPMCM/study/README.md
          git commit -m 'docs: record provisional 2025 C evidence study [skip ci]'
          git push origin HEAD:main
