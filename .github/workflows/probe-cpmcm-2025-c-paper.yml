name: Probe CPMCM 2025 C paper
on:
  push:
    paths:
      - '.github/workflows/probe-cpmcm-2025-c-paper.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Search public corpus repository history
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/yan315598-design/mathmodel-studio.git /tmp/mmstudio
          cd /tmp/mmstudio
          git fetch --all --tags --prune
          echo '--- current tree filename search ---'
          git ls-tree -r --name-only HEAD | grep -Ei 'Frangi|裂隙|2025.*C' | head -100 || true
          echo '--- all-history filename search ---'
          git log --all --full-history --name-only --pretty='format:COMMIT %H' -- . | grep -Ei '(^COMMIT|Frangi|裂隙|2025年研究生数学建模竞赛优秀论文选)' | head -400 || true
          echo '--- large blob candidates in reachable history ---'
          git rev-list --objects --all | grep -Ei 'Frangi|裂隙|C题优秀论文' | head -200 || true
