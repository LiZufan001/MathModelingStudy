name: Probe CPMCM 2025 C paper
on:
  push:
    paths:
      - '.github/workflows/probe-cpmcm-2025-c-paper.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2025/C/C题：围岩裂隙精准识别与三维模型重构.docx
            .github/workflows/probe-cpmcm-2025-c-paper.yml
      - run: python -m pip install --quiet python-docx
      - name: Extract official problem text
        shell: bash
        run: |
          python - <<'PY'
          from docx import Document
          from pathlib import Path
          p=Path('problems/CPMCM/2025/C/C题：围岩裂隙精准识别与三维模型重构.docx')
          d=Document(str(p))
          lines=[]
          for para in d.paragraphs:
              if para.text.strip(): lines.append(para.text)
          for ti,t in enumerate(d.tables,1):
              lines.append(f'\n[TABLE {ti}]')
              for row in t.rows:
                  lines.append(' | '.join(c.text.replace('\n',' / ') for c in row.cells))
          print('\n'.join(lines).encode('utf-8','replace').decode('utf-8'))
          PY
