name: Probe CPMCM 2025 A Q3 Formal Spill Matrix

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/q3-pipeline-20260911"
    paths:
      - "problems/CPMCM/2025/A/src/q3_spill_batch_optimizer.py"
      - "problems/CPMCM/2025/A/src/q3_official_spill_optimizer.py"
      - "problems/CPMCM/2025/A/tests/test_q3_spill_batch_optimizer.py"
      - "problems/CPMCM/2025/A/tests/test_q3_official_spill_optimizer.py"

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sparse checkout 2025 A only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2025/A
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Formal spill-batch gates
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest \
            problems/CPMCM/2025/A/tests/test_q3_evaluator.py \
            problems/CPMCM/2025/A/tests/test_q3_official_optimizer.py \
            problems/CPMCM/2025/A/tests/test_q3_spill_batch_optimizer.py \
            problems/CPMCM/2025/A/tests/test_q3_official_spill_optimizer.py \
            -q
          python -m py_compile problems/CPMCM/2025/A/experiments/benchmark_q3_official_spill_matrix_case.py

  formal-matrix:
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        case:
          - Matmul_Case0
          - Matmul_Case1
          - FlashAttention_Case0
          - FlashAttention_Case1
          - Conv_Case0
          - Conv_Case1
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Sparse checkout 2025 A only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2025/A
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run formal spill-batch case
        run: |
          python problems/CPMCM/2025/A/experiments/benchmark_q3_official_spill_matrix_case.py \
            --data-dir problems/CPMCM/2025/A/data/csv \
            --case "${{ matrix.case }}" \
            --spill-max-rounds 12 \
            --out "/tmp/q3-formal-spill-${{ matrix.case }}.json"
      - name: Upload formal case evidence
        uses: actions/upload-artifact@v4
        with:
          name: cpmcm-2025-a-q3-formal-spill-${{ matrix.case }}
          path: /tmp/q3-formal-spill-${{ matrix.case }}.json
          if-no-files-found: error
