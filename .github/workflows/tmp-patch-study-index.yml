name: Patch study index for training assets
on:
  push:
    paths:
      - '.github/workflows/tmp-patch-study-index.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch study README
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('papers/CPMCM/study/README.md')
          s=p.read_text(encoding='utf-8')
          anchor='- [`ORIGINAL_PAPER_NARRATIVE_STUDY.md`](ORIGINAL_PAPER_NARRATIVE_STUDY.md)：**国一原文叙事研究**。直接回到 exact-match PDF，研究摘要、问题分析、问间过渡、失败实验与结果分析的真实写法。'
          add=anchor+'\n- [`ORIGINAL_NARRATIVE_MATRIX.md`](ORIGINAL_NARRATIVE_MATRIX.md)：**8 篇国一原文研究动作矩阵**。横向对照摘要、问题分析、方法引入、问间接口、失败调整、结果解释与结论强度。\n- [`TRAINING_ROADMAP.md`](TRAINING_ROADMAP.md)：**赛前训练路线**。P0 盲做对照、P1 Starter Kit、P2 原文矩阵、P3 摘要训练、P4 exact-match 补全、P5 模拟赛闭环。\n- [`../../../resources/competition_starter_kit/README.md`](../../../resources/competition_starter_kit/README.md)：**Competition Starter Kit v0.1**。把 evaluator、决策日志、单一结果源、论文数字渲染和 preflight 落成可执行工具。'
          if 'ORIGINAL_NARRATIVE_MATRIX.md' not in s:
              if anchor not in s:
                  raise SystemExit('anchor not found')
              s=s.replace(anchor,add,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'LiZufan001'
          git config user.email '128899229+LiZufan001@users.noreply.github.com'
          git add papers/CPMCM/study/README.md
          git diff --cached --quiet && exit 0
          git commit -m 'study: link training system and original narrative matrix'
          git fetch origin main
          git rebase origin/main
          git push
