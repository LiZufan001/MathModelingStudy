name: Patch study index for training assets
on:
  push:
    paths:
      - '.github/workflows/tmp-patch-study-index.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch study README
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('papers/CPMCM/study/README.md')
          s=p.read_text(encoding='utf-8')
          anchor='- [`TRAINING_ROADMAP.md`](TRAINING_ROADMAP.md)：**赛前训练路线**。P0 盲做对照、P1 Starter Kit、P2 原文矩阵、P3 摘要训练、P4 exact-match 补全、P5 模拟赛闭环。'
          add=anchor+'\n- [`ABSTRACT_AND_PROBLEM_ANALYSIS_DRILL.md`](ABSTRACT_AND_PROBLEM_ANALYSIS_DRILL.md)：**摘要 / 问题分析专项训练**。按“闭卷写→揭示原文→诊断→关闭原文重写”训练，不背范文模板。'
          if 'ABSTRACT_AND_PROBLEM_ANALYSIS_DRILL.md' not in s:
              if anchor not in s:
                  raise SystemExit('anchor not found')
              s=s.replace(anchor,add,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'LiZufan001'
          git config user.email '128899229+LiZufan001@users.noreply.github.com'
          git add papers/CPMCM/study/README.md
          git diff --cached --quiet && exit 0
          git commit -m 'study: link abstract and problem-analysis drill'
          git fetch origin main
          git rebase origin/main
          git push
