name: Probe CPMCM 2025 A Q3 Conv1 Critical Spill Switch

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/q3-pipeline-20260911"
    paths:
      - "problems/CPMCM/2025/A/experiments/q3_critical_spill_switch.py"
      - "problems/CPMCM/2025/A/experiments/test_q3_critical_spill_switch.py"
      - "problems/CPMCM/2025/A/experiments/benchmark_q3_critical_spill_switch_snapshot.py"
      - ".github/workflows/probe-cpmcm-2025-a-q3-conv1-critical-spill-switch.yml"

permissions:
  contents: read

jobs:
  critical-spill-switch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sparse checkout 2025 A only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2025/A
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synthetic critical-switch gate
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest problems/CPMCM/2025/A/experiments/test_q3_critical_spill_switch.py -q
      - name: Probe saturated Conv1 critical spill switches
        run: |
          python problems/CPMCM/2025/A/experiments/benchmark_q3_critical_spill_switch_snapshot.py \
            --data-dir problems/CPMCM/2025/A/data/csv \
            --snapshot problems/CPMCM/2025/A/experiments/snapshots/q3_conv1_saturated_offsets.json \
            --out /tmp/q3-conv1-critical-spill-switch.json \
            --max-switches 8
      - name: Upload critical-switch evidence
        uses: actions/upload-artifact@v4
        with:
          name: cpmcm-2025-a-q3-conv1-critical-spill-switch
          path: /tmp/q3-conv1-critical-spill-switch.json
          if-no-files-found: error
