name: Probe CPMCM 2025 A Q3 Conv0 Formal Spill Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/q3-pipeline-20260911"
    paths:
      - ".github/workflows/probe-cpmcm-2025-a-q3-conv0-formal-spill.yml"

permissions:
  contents: read

jobs:
  conv0-formal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Sparse checkout 2025 A only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2025/A
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Targeted formal gates
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest \
            problems/CPMCM/2025/A/tests/test_q3_evaluator.py \
            problems/CPMCM/2025/A/tests/test_q3_official_optimizer.py \
            problems/CPMCM/2025/A/tests/test_q3_spill_batch_optimizer.py \
            problems/CPMCM/2025/A/tests/test_q3_official_spill_optimizer.py \
            -q
          python -m py_compile problems/CPMCM/2025/A/experiments/benchmark_q3_official_spill_matrix_case.py
      - name: Run Conv0 formal acceptance
        run: |
          python problems/CPMCM/2025/A/experiments/benchmark_q3_official_spill_matrix_case.py \
            --data-dir problems/CPMCM/2025/A/data/csv \
            --case Conv_Case0 \
            --spill-max-rounds 12 \
            --out /tmp/q3-formal-spill-Conv_Case0.json
      - name: Upload Conv0 formal evidence
        uses: actions/upload-artifact@v4
        with:
          name: cpmcm-2025-a-q3-formal-spill-Conv_Case0-monotone
          path: /tmp/q3-formal-spill-Conv_Case0.json
          if-no-files-found: error
