name: Probe CPMCM 2025 A Q3 Conv1 Third Switch

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/q3-pipeline-20260911"
    paths:
      - "problems/CPMCM/2025/A/experiments/snapshots/q3_conv1_two_switch_recipe.json"
      - "problems/CPMCM/2025/A/experiments/benchmark_q3_third_spill_switch_snapshot.py"
      - ".github/workflows/probe-cpmcm-2025-a-q3-conv1-third-switch.yml"

permissions:
  contents: read

jobs:
  third-switch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sparse checkout 2025 A only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2025/A
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synthetic switch gates
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest \
            problems/CPMCM/2025/A/experiments/test_q3_critical_spill_switch.py \
            problems/CPMCM/2025/A/experiments/test_q3_critical_spill_switch_recipe.py \
            -q
      - name: Replay two strict switches, snapshot solution, search third
        run: |
          python problems/CPMCM/2025/A/experiments/benchmark_q3_third_spill_switch_snapshot.py \
            --data-dir problems/CPMCM/2025/A/data/csv \
            --snapshot problems/CPMCM/2025/A/experiments/snapshots/q3_conv1_saturated_offsets.json \
            --recipe problems/CPMCM/2025/A/experiments/snapshots/q3_conv1_two_switch_recipe.json \
            --solution-out /tmp/q3-conv1-two-switch-solution.json \
            --out /tmp/q3-conv1-third-switch.json \
            --max-switches 8
      - name: Upload two-switch snapshot and third-switch evidence
        uses: actions/upload-artifact@v4
        with:
          name: cpmcm-2025-a-q3-conv1-third-switch
          path: |
            /tmp/q3-conv1-two-switch-solution.json
            /tmp/q3-conv1-third-switch.json
          if-no-files-found: error
