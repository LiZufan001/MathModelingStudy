name: Probe CPMCM 2025 A Q3 Conv1 Post-Batch Greedy

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/q3-pipeline-20260911"
    paths:
      - ".github/workflows/probe-cpmcm-2025-a-q3-conv1-post-batch-greedy.yml"

permissions:
  contents: read
  actions: read

jobs:
  post-batch-greedy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sparse checkout 2025 A only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2025/A
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download saturated iterative candidate
        uses: actions/download-artifact@v4
        with:
          name: cpmcm-2025-a-q3-conv1-iterative-batch
          path: /tmp/source
          github-token: ${{ github.token }}
          repository: LiZufan001/MathModelingStudy
          run-id: 34743831756
      - name: Post-batch greedy gates
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest \
            problems/CPMCM/2025/A/experiments/test_q3_critical_spill_switch.py \
            problems/CPMCM/2025/A/experiments/test_q3_conv_greedy_spill_switch.py \
            -q
          python -m py_compile problems/CPMCM/2025/A/experiments/benchmark_q3_batch_greedy_polish_snapshot.py
      - name: Greedily polish saturated iterative candidate
        run: |
          python problems/CPMCM/2025/A/experiments/benchmark_q3_batch_greedy_polish_snapshot.py \
            --data-dir problems/CPMCM/2025/A/data/csv \
            --solution /tmp/source/q3-conv1-iterative-batch-solution.json \
            --out /tmp/q3-conv1-post-batch-greedy.json \
            --max-rounds 8 \
            --max-switches 16
      - name: Upload post-batch greedy evidence
        uses: actions/upload-artifact@v4
        with:
          name: cpmcm-2025-a-q3-conv1-post-batch-greedy
          path: /tmp/q3-conv1-post-batch-greedy.json
          if-no-files-found: error
