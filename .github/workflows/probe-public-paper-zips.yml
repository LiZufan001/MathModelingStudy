name: Inspect public E paper candidate

on:
  push:
    paths:
      - '.github/workflows/probe-public-paper-zips.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download candidate and extract first pages
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/xiyuhang2003/E-problem/0b203fe7bf693bcf808109372566b6ba82847541/E%E9%A2%98.pdf' -o /tmp/candidate.pdf
          echo "PDF_BYTES $(stat -c%s /tmp/candidate.pdf)"
          echo "PDF_SHA256 $(sha256sum /tmp/candidate.pdf | cut -d' ' -f1)"
          echo "PDF_MAGIC $(head -c 8 /tmp/candidate.pdf | xxd -p)"
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null
          pdfinfo /tmp/candidate.pdf | sed -n '1,30p'
          echo 'PDFTEXT_BEGIN'
          pdftotext -f 1 -l 5 -layout /tmp/candidate.pdf - | sed -n '1,500p'
          echo 'PDFTEXT_END'
