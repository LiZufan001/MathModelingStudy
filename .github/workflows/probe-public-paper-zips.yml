name: Inspect Weizan APIs for CPMCM 2025 defense replay

on:
  push:
    paths:
      - '.github/workflows/probe-public-paper-zips.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspect frontend JS for replay and media APIs
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152.0 Safari/537.36'
          JS='https://j.vzan.com/live-statics/livepage/app.6f5e46e8.js'
          curl -L --fail --retry 3 -A "$UA" "$JS" -o /tmp/app.js
          echo "JS_BYTES=$(stat -c%s /tmp/app.js)"
          python - <<'PY'
          import re, html
          s=open('/tmp/app.js','rb').read().decode('utf-8','replace')
          print('=== ABSOLUTE_URLS ===')
          urls=sorted(set(re.findall(r'https?://[^"\'<>\\\s]+',s)))
          for u in urls:
              if any(k in u.lower() for k in ['api','live','play','video','record','replay','vod','m3u8','vzan','weizan']):
                  print('URL',html.unescape(u)[:4000])
          print('=== ENDPOINT-LIKE STRINGS ===')
          strings=set(re.findall(r'["\']([^"\']{4,300})["\']',s))
          hits=[]
          for x in strings:
              lx=x.lower()
              if (x.startswith('/') or 'api' in lx) and any(k in lx for k in ['live','play','video','record','replay','vod','room','page','detail','info']):
                  hits.append(x)
          for x in sorted(hits)[:1000]: print('STR',x)
          print('=== CONTEXTS ===')
          key=re.compile(r'(getlive|liveinfo|liveid|topicid|record|replay|playurl|videourl|m3u8|vod|videoid|playback)',re.I)
          seen=set(); n=0
          for m in key.finditer(s):
              a=max(0,m.start()-600); b=min(len(s),m.end()+1200)
              c=s[a:b].replace('\n',' ')
              sig=c[:300]
              if sig in seen: continue
              seen.add(sig); print('CTX',re.sub(r'\s+',' ',c)[:2200]); n+=1
              if n>=120: break
          print('CONTEXT_COUNT',n)
          PY
