name: Probe CPMCM 2025 Math Modeling Star defense video

on:
  push:
    paths:
      - '.github/workflows/probe-public-paper-zips.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-video:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download low-res public defense video and OCR slides
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade yt-dlp
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-chi-sim ffmpeg >/dev/null
          mkdir -p /tmp/star
          for p in 1 2; do
            echo "=== PART $p METADATA ==="
            yt-dlp --no-warnings --print 'title=%(title)s duration=%(duration_string)s id=%(id)s' "https://www.bilibili.com/video/BV1oi2DBXEJE/?p=$p" || true
            echo "=== PART $p DOWNLOAD ==="
            yt-dlp --no-warnings --retries 3 --fragment-retries 3 \
              -f 'worstvideo[height>=360]/worstvideo/worst' \
              -o "/tmp/star/part${p}.%(ext)s" \
              "https://www.bilibili.com/video/BV1oi2DBXEJE/?p=$p"
            f=$(ls /tmp/star/part${p}.* | head -1)
            echo "VIDEO_FILE=$f BYTES=$(stat -c%s "$f")"
            mkdir -p "/tmp/star/frames$p"
            ffmpeg -hide_banner -loglevel error -i "$f" -vf "fps=1/60,scale=1280:-1" -q:v 3 "/tmp/star/frames$p/%04d.jpg"
            echo "FRAME_COUNT_PART_$p=$(find /tmp/star/frames$p -name '*.jpg' | wc -l)"
            i=0
            for img in /tmp/star/frames$p/*.jpg; do
              i=$((i+1))
              sec=$(( (i-1)*60 ))
              txt=$(tesseract "$img" stdout -l chi_sim+eng --psm 6 2>/dev/null | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | cut -c1-1800)
              if echo "$txt" | grep -Eiq '题|模型|研究|建模|大学|MIMO|OFDM|Frangi|湍流|轴承|园林|NPU|调度|裂隙|答辩|路径|诊断'; then
                printf 'OCR part=%s sec=%s frame=%s :: %s\n' "$p" "$sec" "$(basename "$img")" "$txt"
              fi
            done
          done
