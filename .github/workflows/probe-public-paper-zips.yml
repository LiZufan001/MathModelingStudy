name: Probe public 2025 paper zip

on:
  push:
    paths:
      - '.github/workflows/probe-public-paper-zips.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and inspect public zip
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, io, urllib.request, zipfile
          url = 'https://raw.githubusercontent.com/DDDDDawn/railway_failure_detection/master/%E5%85%A8%E5%9B%BD%E7%A0%94%E7%A9%B6%E7%94%9F%E6%95%B0%E5%AD%A6%E5%BB%BA%E6%A8%A1%E7%AB%9E%E8%B5%9B%E8%AE%BA%E6%96%87%E6%A0%87%E9%A2%98__1_.zip'
          data = urllib.request.urlopen(url, timeout=60).read()
          print('ZIP_BYTES', len(data))
          print('ZIP_SHA256', hashlib.sha256(data).hexdigest())
          z = zipfile.ZipFile(io.BytesIO(data))
          for info in z.infolist():
              print('ENTRY', info.filename, info.file_size)
              if not info.is_dir() and info.file_size <= 50_000_000:
                  b = z.read(info)
                  print('ENTRY_SHA256', info.filename, hashlib.sha256(b).hexdigest())
                  print('ENTRY_MAGIC', info.filename, b[:8])
          PY
