name: Hunt public CPMCM 2025 paper files

on:
  push:
    paths:
      - '.github/workflows/probe-public-paper-zips.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Enumerate public contestant repositories and paper-like files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, time, urllib.parse, urllib.request

          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'CPMCM-2025-public-paper-hunter',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          queries = [
              'GMCM2025',
              'HuaweiCup2025',
              'HuaweiCup 2025 math modeling',
              '华为杯 2025 数学建模',
              '2025 华为杯 研究生 数学建模',
              '2025研究生数学建模',
              '研究生数学建模 2025',
              'PGMM2025',
              '25HuaweiCup',
              '2025MathGame',
              'railway failure detection 2025 Huawei',
              'MIMO OFDM 2025 modeling',
          ]

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode('utf-8'))

          repos = {}
          for q in queries:
              url = 'https://api.github.com/search/repositories?' + urllib.parse.urlencode({
                  'q': q, 'per_page': 100, 'sort': 'updated', 'order': 'desc'
              })
              try:
                  data = get(url)
              except Exception as e:
                  print('SEARCH_ERROR', q, repr(e))
                  time.sleep(3)
                  continue
              print('SEARCH', q, 'count', data.get('total_count'), 'returned', len(data.get('items', [])))
              for r in data.get('items', []):
                  repos[r['full_name']] = {
                      'default_branch': r.get('default_branch') or 'main',
                      'size': r.get('size'),
                      'description': r.get('description') or '',
                      'html_url': r.get('html_url'),
                  }
              time.sleep(1)

          print('UNIQUE_REPOS', len(repos))
          paper_ext = re.compile(r'\.(pdf|docx|doc|tex|zip|7z|rar)$', re.I)
          code_name = re.compile(r'(^|/)[A-F]251\d{8}\.(pdf|docx|doc)$', re.I)
          interest = re.compile(r'(paper|论文|doc|document|final|submit|submission|report|答辩|获奖|award|certificate|证书)', re.I)
          award_words = re.compile(r'(全国一等奖|国家一等奖|一等奖|first\s*prize|national\s*first)', re.I)

          candidates = []
          for idx, (full, meta) in enumerate(sorted(repos.items()), 1):
              owner, repo = full.split('/', 1)
              branch = meta['default_branch']
              tree_url = f'https://api.github.com/repos/{owner}/{repo}/git/trees/{urllib.parse.quote(branch, safe="")}?recursive=1'
              try:
                  tree = get(tree_url)
              except Exception as e:
                  print('TREE_ERROR', full, repr(e))
                  continue
              paths = [x.get('path','') for x in tree.get('tree', []) if x.get('type') == 'blob']
              hits = [p for p in paths if paper_ext.search(p) and (code_name.search(p) or interest.search(p) or p.lower().endswith('.pdf'))]
              readme_text = ''
              for rp in ('README.md','readme.md','README.MD'):
                  if rp in paths:
                      raw = f'https://raw.githubusercontent.com/{owner}/{repo}/{urllib.parse.quote(branch, safe="")}/{rp}'
                      try:
                          req = urllib.request.Request(raw, headers={'User-Agent':'CPMCM-hunter'})
                          readme_text = urllib.request.urlopen(req, timeout=15).read().decode('utf-8', errors='replace')[:100000]
                      except Exception:
                          pass
                      break
              award = bool(award_words.search(readme_text))
              code_hits = [p for p in hits if code_name.search(p)]
              if hits or award:
                  rec = {
                      'repo': full,
                      'size_kb': meta['size'],
                      'description': meta['description'],
                      'award_claim': award,
                      'code_hits': code_hits,
                      'file_hits': hits[:80],
                      'truncated_tree': bool(tree.get('truncated')),
                  }
                  candidates.append(rec)
                  print('CANDIDATE', json.dumps(rec, ensure_ascii=False))
              if idx % 25 == 0:
                  print('PROGRESS', idx, '/', len(repos))
              time.sleep(0.15)

          print('CANDIDATE_COUNT', len(candidates))
          print('CODE_PDF_REPOS', sum(bool(x['code_hits']) for x in candidates))
          print('AWARD_CLAIM_REPOS', sum(x['award_claim'] for x in candidates))
          PY
