name: Hunt deleted CPMCM 2025 paper files

on:
  push:
    paths:
      - '.github/workflows/probe-public-paper-zips.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Scan full commit histories of real contestant repos
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, time, urllib.request
          token=os.environ['GH_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','User-Agent':'CPMCM2025-history-hunter','X-GitHub-Api-Version':'2022-11-28'}
          repos=[
            'zm-astro/gmcm2025',
            'juniorPOON/HuaweiCup2025',
            'HelenLi1025/2025MathGame-E-lwp',
            'RessMatthew/HuaweiCup-E',
            'XinhanWang/PGMM2025',
            'DDDDDawn/railway_failure_detection',
            'xiyuhang2003/E-problem',
            'yangzhe0/study_shumo',
            'Nanqipro/25HuaweiCup_MCM',
            'yohakuo/GMCM2025',
            'wxzher/2025-HuaweiCup-E',
            'HaoyuZhao31415/MathModel'
          ]
          paper=re.compile(r'\.(pdf|docx|doc|tex|zip|7z|rar)$',re.I)
          strong=re.compile(r'(251\d{8}|论文|paper|final|submit|submission|终稿|最终|答辩|证书|award|获奖)',re.I)
          def get(url):
            req=urllib.request.Request(url,headers=headers)
            with urllib.request.urlopen(req,timeout=30) as r:return json.loads(r.read().decode('utf-8'))
          for full in repos:
            print('REPO_BEGIN',full)
            try: commits=get(f'https://api.github.com/repos/{full}/commits?per_page=100')
            except Exception as e:
              print('COMMITS_ERROR',full,repr(e));continue
            print('COMMIT_COUNT',full,len(commits))
            for c in reversed(commits):
              sha=c.get('sha'); msg=(c.get('commit') or {}).get('message','').replace('\n',' ')[:300]
              try: detail=get(f'https://api.github.com/repos/{full}/commits/{sha}')
              except Exception as e:
                print('DETAIL_ERROR',full,sha,repr(e));continue
              hits=[]
              for f in detail.get('files') or []:
                fn=f.get('filename','')
                prev=f.get('previous_filename','') or ''
                if (paper.search(fn) or paper.search(prev)) and (strong.search(fn) or strong.search(prev) or fn.lower().endswith('.pdf')):
                  hits.append({'status':f.get('status'),'filename':fn,'previous_filename':prev,'sha':f.get('sha'),'raw_url':f.get('raw_url')})
              if hits or re.search(r'(论文|paper|final|submit|终稿|获奖|award)',msg,re.I):
                print('HISTORY_HIT',json.dumps({'repo':full,'commit':sha,'date':((c.get('commit') or {}).get('author') or {}).get('date'),'message':msg,'files':hits},ensure_ascii=False))
              time.sleep(0.08)
            print('REPO_END',full)
          PY
