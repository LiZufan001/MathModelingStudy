name: Query Weizan CPMCM 2025 replay configuration

on:
  push:
    paths:
      - '.github/workflows/probe-public-paper-zips.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query-config:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe public topic and video configuration APIs
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152.0 Safari/537.36'
          TP='703616836'
          REFER='https://etxgdu.vnet.weizan.cn/live/page/703616836?v=1764845309273'
          hosts=(
            'https://re-live-play.vzan.com'
            'https://live-play.vzan.com'
            'https://live-capi.vzan.com'
            'https://liveapi.vzan.com'
            'https://live-liveapi.vzan.com'
          )
          paths=(
            "/play/api/topic/topic_config?tpId=$TP&isPcBrowser=true&topicId=$TP&browserTerminal=1"
            "/play/api/topic/video_config?tpId=$TP&browserTerminal=1"
            "/api/topic/topic_config?tpId=$TP&isPcBrowser=true&topicId=$TP&browserTerminal=1"
            "/api/topic/video_config?tpId=$TP&browserTerminal=1"
            "/api/topic/topic_menu_ppt_data?tpid=$TP"
          )
          for h in "${hosts[@]}"; do
            for p in "${paths[@]}"; do
              u="$h$p"
              code=$(curl -L -sS -A "$UA" -e "$REFER" -o /tmp/r.txt -w '%{http_code}' "$u" || true)
              bytes=$(stat -c%s /tmp/r.txt 2>/dev/null || echo 0)
              echo "=== PROBE code=$code bytes=$bytes url=$u ==="
              if [ "$bytes" -gt 0 ]; then head -c 12000 /tmp/r.txt | tr '\n' ' '; echo; fi
            done
          done
          echo '=== FIND BASE CONSTANTS ==='
          curl -L --fail -sS -A "$UA" 'https://j.vzan.com/live-statics/livepage/app.6f5e46e8.js' -o /tmp/app.js
          python - <<'PY'
          import re
          s=open('/tmp/app.js','rb').read().decode('utf-8','replace')
          for key in ['Ji','bX','y7','_5']:
              print('KEY',key)
              # contexts where object properties define environment URLs
              pat=re.compile(r'\b'+re.escape(key)+r'\s*[:=]')
              n=0
              for m in pat.finditer(s):
                  c=re.sub(r'\s+',' ',s[max(0,m.start()-1000):min(len(s),m.end()+1800)])
                  if 'vzan.com' in c or 'weizan.cn' in c:
                      print('CTX',c[:3500]); n+=1
                      if n>=8: break
          PY
