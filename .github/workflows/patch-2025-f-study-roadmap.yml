name: Patch 2025 F study roadmap
on:
  push:
    paths:
      - '.github/workflows/patch-2025-f-study-roadmap.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch roadmap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('papers/CPMCM/study/README.md')
          s=p.read_text(encoding='utf-8')
          old='| 13 | 2025 F | 湖州师范学院 周萌团队 | 主观美学→可计算指标、图模型、路径规划 | ⏳ 待确认全文 |'
          new='| 13 | 2025 F | 湖州师范学院 周萌团队 | 主观美学→可计算指标、图模型、路径规划 | 🟡 F1候选证据重构；目标队全文未找到 |'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('roadmap row not found')

          marker='## 13. 2025 F｜77892f7dcdfe 主候选（证据级深读 + 实战综合）'
          if marker not in s:
              s += '''\n\n## 13. 2025 F｜77892f7dcdfe 主候选（证据级深读 + 实战综合）\n\n> **身份边界：**目标国一作品为湖州师范学院周萌团队 `F25100130044`《江南古典园林的游园路线规划及美学特征建模》；当前四份 2025 F 优秀论文候选题名均不同，不能绑定目标队。本目录以 182 页 `F题-1-江南古典园林的美学特征建模`（evidence `77892f7dcdfe`）为主证据，并横向吸收其余 F 题候选中可迁移的实战技巧。\n\n- [`2025-F-77892f7dcdfe/README.md`](2025-F-77892f7dcdfe/README.md)：主观概念→机制→路径/评分/相似度证据级深读\n- [`2025-F-77892f7dcdfe/MODEL_RECONSTRUCTION.md`](2025-F-77892f7dcdfe/MODEL_RECONSTRUCTION.md)：统一 subjective concept → observable state → decision → validation 重构\n- [`2025-F-77892f7dcdfe/PRACTICAL_MODELING_TOOLKIT.md`](2025-F-77892f7dcdfe/PRACTICAL_MODELING_TOOLKIT.md)：四份 F 题优秀论文横向提炼的赛场实战工具箱\n- [`2025-F-77892f7dcdfe/REVIEWER_REPORT.md`](2025-F-77892f7dcdfe/REVIEWER_REPORT.md)：模拟评审与 16 个答辩追问\n- [`2025-F-77892f7dcdfe/TARGET_TEAM_COMPARISON.md`](2025-F-77892f7dcdfe/TARGET_TEAM_COMPARISON.md)：湖州师范目标国一公开方法链对照\n- [`2025-F-77892f7dcdfe/COMPETITION_PLAYBOOK.md`](2025-F-77892f7dcdfe/COMPETITION_PLAYBOOK.md)：主观评价/空间体验题速查\n- [`2025-F-77892f7dcdfe/SOURCE_PROVENANCE.md`](2025-F-77892f7dcdfe/SOURCE_PROVENANCE.md)：候选全文、目标队与证据边界\n'''
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'LiZufan001'
          git config user.email '128899229+LiZufan001@users.noreply.github.com'
          git add papers/CPMCM/study/README.md
          git diff --cached --quiet && exit 0
          git commit -m 'study: index provisional 2025 F practical deep read'
          git push
