name: Read B24102860287 for study
on:
  push:
    paths:
      - '.github/workflows/read-b24102860287.yml'
permissions:
  contents: read
jobs:
  read-paper:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            papers/CPMCM/2024/fulltext/B/B24102860287.pdf
            problems/CPMCM/2024/B/WLAN组网中网络吞吐量建模.docx
            problems/CPMCM/2024/B/B题.zip
            .github/workflows/read-b24102860287.yml
      - name: Install readers
        run: python -m pip install --quiet pypdf pymupdf python-docx pandas openpyxl
      - name: Extract paper, problem, package, and render pages
        shell: bash
        run: |
          mkdir -p /tmp/b24102860287/pages /tmp/b24102860287/problem_pkg
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          from docx import Document
          import pymupdf, zipfile, json, os, pandas as pd

          p=Path('papers/CPMCM/2024/fulltext/B/B24102860287.pdf')
          d=Path('problems/CPMCM/2024/B/WLAN组网中网络吞吐量建模.docx')
          z=Path('problems/CPMCM/2024/B/B题.zip')
          out=Path('/tmp/b24102860287')

          r=PdfReader(str(p))
          print(f'PDF_META pages={len(r.pages)} encrypted={r.is_encrypted} bytes={p.stat().st_size}')
          py=[]
          for i,page in enumerate(r.pages,1):
              py.append(f'===== PAGE {i} / {len(r.pages)} =====\n{page.extract_text() or "[NO TEXT]"}')
          (out/'pypdf.txt').write_text('\n\n'.join(py),encoding='utf-8')

          doc=pymupdf.open(str(p))
          fitz=[]
          for i,page in enumerate(doc,1):
              fitz.append(f'===== PAGE {i} / {len(doc)} =====\n{page.get_text("text",sort=True)}')
              pix=page.get_pixmap(matrix=pymupdf.Matrix(1.7,1.7),alpha=False)
              pix.save(out/f'pages/page-{i:02d}.png')
          (out/'pymupdf.txt').write_text('\n\n'.join(fitz),encoding='utf-8')
          print(f'RENDERED_PAGES={len(doc)}')

          dd=Document(str(d))
          problem=[]
          for para in dd.paragraphs:
              if para.text.strip(): problem.append(para.text)
          for ti,table in enumerate(dd.tables,1):
              problem.append(f'\n[TABLE {ti}]')
              for row in table.rows:
                  problem.append(' | '.join(cell.text.replace('\n',' / ') for cell in row.cells))
          (out/'problem.txt').write_text('\n'.join(problem),encoding='utf-8')

          with zipfile.ZipFile(z) as zz:
              names=zz.namelist()
              (out/'problem-package-files.json').write_text(json.dumps(names,ensure_ascii=False,indent=2),encoding='utf-8')
              zz.extractall(out/'problem_pkg')
          summaries=[]
          for fp in sorted((out/'problem_pkg').rglob('*')):
              if fp.is_file():
                  rel=str(fp.relative_to(out/'problem_pkg'))
                  summaries.append(f'{rel}\t{fp.stat().st_size}')
          (out/'problem-package-summary.txt').write_text('\n'.join(summaries),encoding='utf-8')
          print('PROBLEM_PREVIEW')
          print('\n'.join(problem)[:14000])
          print('PACKAGE_FILES')
          print('\n'.join(summaries)[:14000])
          PY
      - name: Upload study extraction
        uses: actions/upload-artifact@v4
        with:
          name: b24102860287-study-extraction
          path: /tmp/b24102860287/
          if-no-files-found: error
          retention-days: 1
