name: Probe CPMCM 2025 A Q3 Conv1 Batch Greedy Polish

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/q3-pipeline-20260911"
    paths:
      - "problems/CPMCM/2025/A/experiments/benchmark_q3_batch_greedy_polish_snapshot.py"
      - ".github/workflows/probe-cpmcm-2025-a-q3-conv1-batch-greedy-polish.yml"

permissions:
  contents: read
  actions: read

jobs:
  batch-greedy-polish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sparse checkout 2025 A only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            problems/CPMCM/2025/A
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download strict batch solution artifact
        uses: actions/download-artifact@v4
        with:
          name: cpmcm-2025-a-q3-conv1-spill-switch-batch
          path: /tmp/batch-source
          github-token: ${{ github.token }}
          repository: LiZufan001/MathModelingStudy
          run-id: 34684161605
      - name: Batch greedy polish gates
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest \
            problems/CPMCM/2025/A/experiments/test_q3_critical_spill_switch.py \
            problems/CPMCM/2025/A/experiments/test_q3_conv_greedy_spill_switch.py \
            -q
          python -m py_compile problems/CPMCM/2025/A/experiments/benchmark_q3_batch_greedy_polish_snapshot.py
      - name: Greedily polish strict batch solution
        run: |
          python problems/CPMCM/2025/A/experiments/benchmark_q3_batch_greedy_polish_snapshot.py \
            --data-dir problems/CPMCM/2025/A/data/csv \
            --solution /tmp/batch-source/q3-conv1-batch-switch-solution.json \
            --out /tmp/q3-conv1-batch-greedy-polish.json \
            --max-rounds 2 \
            --max-switches 8
      - name: Upload batch greedy polish evidence
        uses: actions/upload-artifact@v4
        with:
          name: cpmcm-2025-a-q3-conv1-batch-greedy-polish
          path: /tmp/q3-conv1-batch-greedy-polish.json
          if-no-files-found: error
